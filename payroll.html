<!doctype html>
<html lang="en">
<head>
<title>JR Team · Payroll</title><script>window.JR_MOD="payroll";</script><script src="jr.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta name="theme-color" content="#1F3D33"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1d21;--muted:#62666d;--line:#e3e1dc;--gold:#a8790f;--gold-soft:#f6ecd4;--navy:#1f3864;
  --ok:#1d7a46;--ok-soft:#e3f3e9;--bad:#b3261e;--bad-soft:#fbe6e4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 80px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.crumb a{color:var(--navy);text-decoration:none;font-weight:600}
h1{font-size:28px;margin:4px 0 10px}
h2{font-size:20px;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-weight:600}
.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{font:inherit;font-size:16px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{font:inherit;font-weight:600;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 15px;cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.acts .sp{flex:1}
.emp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.emp .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.emp .hd b{font-size:16px}
.emp .sub{font-size:13px;color:var(--muted)}
.emp .f{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.emp .tot{display:flex;justify-content:flex-end;gap:16px;margin-top:8px;font-variant-numeric:tabular-nums}
.emp .tot b{font-size:17px}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.sum div{min-width:110px}.sum .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.sum .v{font-size:22px;font-weight:700}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-weight:600}
.pill.final{background:var(--ok-soft);color:var(--ok)}
.row{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.list .row:last-child{border-bottom:0}
.muted{color:var(--muted)}.small{font-size:13px}
.msg{padding:12px;border-radius:12px;background:var(--gold-soft);margin:10px 0}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{flex:1;border:0;background:var(--card);font:inherit;font-weight:600;padding:11px;color:var(--ink)}.seg button.on{background:var(--navy);color:#fff}
.days{display:flex;flex-wrap:wrap;gap:6px}.dchk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;margin:0;font-size:14px;color:var(--ink)}.dchk input{width:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#1b1d21;color:#fff;padding:10px 16px;border-radius:999px;z-index:80;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="crumb"><a href="register.html">‹ Register</a><span>›</span><span>Payroll</span><a id="sheet" target="_blank" rel="noopener" style="margin-left:auto" hidden>Open sheet</a></div>
  <h1>Payroll</h1>
  <div class="tabs" id="tabs"></div>
  <div id="main"><div class="muted">Loading…</div></div>
</div>
<script>
(function(){
'use strict';
var S={tab:'run',staff:[],lines:[],hours:[],loans:[],run:null,hp:null};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function n(v){return Number(String(v==null?'':v).replace(/[$,\s]/g,''))||0}
function r2(v){return Math.round(v*100)/100}
function money(v){return '$'+r2(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function call(fn){var a=[].slice.call(arguments,1);return JR.rpc('payroll',fn,a)}
function toast(t,bad){var d=document.createElement('div');d.className='toast';d.textContent=t;if(bad)d.style.background='var(--bad)';document.body.appendChild(d);setTimeout(function(){d.remove()},bad?5000:2200)}
function addDays(d,k){var x=new Date(d+'T12:00:00');x.setDate(x.getDate()+k);return x.toISOString().slice(0,10)}
function fmtD(d){if(!d)return'';var x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function per(a){return r2(n(a)/26)}   // paid every other Friday: 26 pay runs a year
function split(l){var p=calc(l).pay,rk=Math.min(Math.max(n(l.rokar),0),p);return'Chase <b>'+money(r2(p-rk))+'</b> + Rokar <b>'+money(rk)+'</b> = <b>'+money(p)+'</b>'+(l.regIds?' · <span style="color:var(--ok)">✓ in Register</span>':'')}
function payDay(end){return end}
var DN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function dow(d){return (new Date(d+'T12:00:00').getDay()+6)%7+1}
function stdDay(s){var a=hm(s.from),b=hm(s.to);if(a==null||b==null)return 0;var m=b-a;if(m<0)m+=1440;return r2(Math.max(0,m-n(s.brk))/60)}
function schedDays(s,start,end){var ds=String(s.days||'').split(',').filter(Boolean).map(Number),out=[];if(!ds.length||!stdDay(s))return out;
  for(var d=start;d<=end;d=addDays(d,1)){if(s.start&&d<s.start)continue;if(ds.indexOf(dow(d))>=0)out.push(d)}return out}
function schedText(s){var ds=String(s.days||'').split(',').filter(Boolean).map(Number).sort();if(!ds.length||!stdDay(s))return'';
  var run=ds.length>1&&ds[ds.length-1]-ds[0]===ds.length-1?DN[ds[0]-1]+'–'+DN[ds[ds.length-1]-1]:ds.map(function(x){return DN[x-1]}).join(', ');
  return run+' '+s.from+'–'+s.to+(n(s.brk)?' (−'+n(s.brk)+' min break)':'')+' · '+stdDay(s)+' h/day'}
function eom(d){var x=new Date(d.slice(0,7)+'-01T12:00:00');x.setMonth(x.getMonth()+1);x.setDate(0);return x.toISOString().slice(0,10)}
var PAY_ANCHOR='2026-11-20';   // a pay Friday; pay runs are every 2nd Friday, covering the 14 days up to that Friday
function periodOf(d){var k=Math.ceil((new Date(d+'T12:00:00')-new Date(PAY_ANCHOR+'T12:00:00'))/864e5/14),end=addDays(PAY_ANCHOR,k*14);return{start:addDays(end,-13),end:end}}
function days(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5)+1}
function salFor(s,start,end){var full=per(s.rate);if(!s.start||s.start<=start)return{amt:full,note:''};if(s.start>end)return{amt:0,note:'Starts '+fmtD(s.start)};
  var d=days(s.start,end),tot=days(start,end);return{amt:r2(full*d/tot),note:'Prorated: started '+fmtD(s.start)+' ('+d+' of '+tot+' days)'}}
function calc(l){var rate=n(l.rate),base=l.type==='hourly'?r2(rate*n(l.regHrs)+rate*(n(l.otRate)||1.5)*n(l.otHrs)):r2(n(l.base));var gross=r2(base+n(l.bonus));return{base:base,gross:gross,pay:r2(gross+n(l.reimb)-n(l.deduct))}}

function runs(){var m={};S.lines.forEach(function(l){var r=m[l.runId]||(m[l.runId]={runId:l.runId,start:l.start,end:l.end,payDate:l.payDate,status:l.status,lines:[],gross:0,pay:0});r.lines.push(l);r.gross+=n(l.gross);r.pay+=n(l.pay);if(l.status==='paid')r.status='paid';else if(l.status==='final'&&r.status!=='paid')r.status='final'});
  return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return a.end<b.end?1:-1})}

function take(r){S.staff=r.staff||[];S.lines=r.lines||[];S.hours=r.hours||[];S.loans=r.loans||[];S.today=r.today;if(r.sheetUrl){$('sheet').href=r.sheetUrl;$('sheet').hidden=false}
  if(r.runId){S.run=runs().filter(function(x){return x.runId===r.runId})[0]||S.run}render()}
function load(){return call('boot').then(function(r){take(r);if(!S.run)S.run=openDraft()||null;render()}).catch(function(e){$('main').innerHTML='<div class="msg bad">'+esc(e.message)+'</div>'})}
function openDraft(){var d=runs().filter(function(r){return r.status==='draft'})[0]||runs().filter(function(r){return r.status==='final'})[0];return d?clone(d):null}
function clone(r){return JSON.parse(JSON.stringify(r))}

function render(){
  $('tabs').innerHTML=[['run','Pay run'],['hours','Hours'],['loans','Loans & bonuses'],['staff','Staff'],['history','History']].map(function(t){return'<button type="button" data-tab="'+t[0]+'"'+(S.tab===t[0]?' class="on"':'')+'>'+t[1]+'</button>'}).join('');
  $('main').innerHTML=S.tab==='loans'?vLoans():S.tab==='hours'?vHours():S.tab==='staff'?vStaff():S.tab==='history'?vHistory():vRun();
}

/* ---------- pay run ---------- */
function newRun(){
  var last=runs()[0],P=periodOf(last?addDays(last.end,1):S.today),start=P.start,end=P.end;
  var lines=S.staff.filter(function(s){return s.active!=='no'&&!(s.start&&s.start>end)}).map(function(s){var sf=s.type==='salary'?salFor(s,start,end):{amt:'',note:''};return{empId:s.id,name:s.name,type:s.type,rate:s.rate,otRate:s.otRate,regHrs:'',otHrs:'',base:s.type==='salary'?String(sf.amt):'',reimb:'',deduct:'',note:sf.note,rokar:n(s.rokar)?String(n(s.rokar)):'',bonus:pendBonus(s.id)||''}});
  var R={runId:'',start:start,end:end,payDate:payDay(end),status:'draft',lines:lines};fillHours(R,true);return R;
}
function vRun(){
  if(!S.staff.length)return'<div class="msg">Add your staff first on the <b>Staff</b> tab.</div>';
  if(!S.run)return'<div class="card"><h2>No pay run open</h2><p class="muted">Start the next pay run (every other Friday, covering the 2 weeks up to that Friday). It picks up from the last one.</p><button class="btn primary" type="button" data-act="new">Start next pay run</button></div>';
  var R=S.run,fin=R.status==='final'||R.status==='paid',paid=R.status==='paid',dis=fin?' disabled':'';
  var tg=0,tp=0;R.lines.forEach(function(l){var c=calc(l);tg+=c.gross;tp+=c.pay});
  var h='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">'+(R.runId?'Pay run':'New pay run')+'</h2><span class="pill'+(fin?' final':'')+'">'+(paid?'Paid ✓':fin?'Final · not paid yet':'Draft')+'</span></div>'+
    '<div class="grid"><div><label>Period start</label><input type="date" data-r="start" value="'+esc(R.start)+'"'+dis+'></div><div><label>Period end</label><input type="date" data-r="end" value="'+esc(R.end)+'"'+dis+'></div><div><label>Pay date</label><input type="date" data-r="payDate" value="'+esc(R.payDate)+'"'+dis+'></div></div>'+
    '<div class="sum" style="margin-top:12px"><div><div class="l">Staff</div><div class="v">'+R.lines.length+'</div></div><div><div class="l">Earned</div><div class="v" id="tg">'+money(tg)+'</div></div><div><div class="l">Net pay to staff</div><div class="v" id="tp">'+money(tp)+'</div></div></div>'+
    '<div class="small muted" style="margin-top:6px">All amounts are net to the employee. Employer taxes are handled separately with the accountant.</div></div>';
  h+=R.lines.map(function(l,i){var c=calc(l),hr=l.type==='hourly';
    return'<div class="emp" data-i="'+i+'"><div class="hd"><b>'+esc(l.name)+'</b><span class="sub">'+(hr?money(l.rate)+'/hr':'Salary '+money(r2(n(l.rate)/12))+'/month · '+money(per(l.rate))+' per pay run')+'</span></div><div class="f">'+
      (hr?fld(i,'regHrs','Hours',l.regHrs,dis):fld(i,'base','Salary this period ($)',l.base,dis))+
      fld(i,'bonus','Bonus ($)',l.bonus,dis)+fld(i,'reimb','Reimbursement ($)',l.reimb,dis)+fld(i,'deduct','Advance / deduction ($)'+(loanBal(l.empId)?' · owes '+money(loanBal(l.empId)):''),l.deduct,dis)+fld(i,'chase','From Chase ($)',String(r2(calc(l).pay-Math.min(Math.max(n(l.rokar),0),calc(l).pay))),dis)+fld(i,'rokar','From Rokar ($)',String(Math.min(Math.max(n(l.rokar),0),calc(l).pay)),dis)+
      '</div><label>Note</label><input data-i="'+i+'" data-k="note" value="'+esc(l.note)+'"'+dis+'>'+
      '<div class="tot"><span class="muted">Earned <b id="g'+i+'">'+money(c.gross)+'</b></span><span>Net pay <b id="p'+i+'">'+money(c.pay)+'</b></span></div><div class="small muted" style="text-align:right" id="sp'+i+'">'+split(l)+'</div><div></div>'+
      (!fin?'<div style="text-align:right;margin-top:6px"><button type="button" class="btn sm" data-act="dropline" data-i="'+i+'">Remove from this run</button></div>':'')+'</div>'}).join('');
  var missing=S.staff.filter(function(s){return s.active!=='no'&&!R.lines.some(function(l){return l.empId===s.id})});
  if(!fin&&missing.length)h+='<div class="acts">'+missing.map(function(s){return'<button type="button" class="btn sm" data-act="addline" data-id="'+esc(s.id)+'">+ '+esc(s.name)+'</button>'}).join('')+'</div>';
  h+='<div class="acts">'+(fin?'<button type="button" class="btn" data-act="reopen">Reopen</button>'+(paid?'':'<span class="sp"></span><button type="button" class="btn primary" data-act="markpaid">Mark paid</button>'):
    (R.runId?'<button type="button" class="btn danger" data-act="delrun">Delete draft</button>':'')+'<span class="sp"></span><button type="button" class="btn" data-act="fillhrs">Fill hours from log</button><button type="button" class="btn" data-act="save">Save draft</button><button type="button" class="btn primary" data-act="final">Finalise</button>')+
    '<button type="button" class="btn" data-act="pdf">PDF payslips</button>'+(paid?'<span class="sp"></span><button type="button" class="btn primary" data-act="new">Start next pay run</button>':'')+'</div>'+(fin&&!paid?'<div class="msg">Finalised — nothing is in the Register yet. Tap <b>Mark paid</b> once you have paid everyone: Chase and Rokar payments are then recorded, and loan repayments and bonuses updated.</div>':'');
  return h;
}
function fld(i,k,lab,v,dis){return'<div><label>'+lab+'</label><input inputmode="decimal" data-i="'+i+'" data-k="'+k+'" value="'+esc(v)+'"'+dis+'></div>'}

document.addEventListener('input',function(e){
  var t=e.target;if(!S.run)return;
  if(t.hasAttribute('data-r')){S.run[t.getAttribute('data-r')]=t.value;return}
  if(t.hasAttribute('data-k')){var i=+t.getAttribute('data-i'),l=S.run.lines[i],kk=t.getAttribute('data-k');
    if(kk==='chase'){var pp=calc(l).pay;l.rokar=String(r2(Math.max(0,pp-n(t.value))));var rb=document.querySelector('[data-i="'+i+'"][data-k="rokar"]');if(rb)rb.value=l.rokar}
    else{l[kk]=t.value;var cb=document.querySelector('[data-i="'+i+'"][data-k="chase"]');if(cb&&kk!=='note'){var pp2=calc(l).pay;cb.value=String(r2(pp2-Math.min(Math.max(n(l.rokar),0),pp2)))}}
    var c=calc(l);$('g'+i).textContent=money(c.gross);$('p'+i).textContent=money(c.pay);$('sp'+i).innerHTML=split(l);
    var tg=0,tp=0;S.run.lines.forEach(function(x){var y=calc(x);tg+=y.gross;tp+=y.pay});$('tg').textContent=money(tg);$('tp').textContent=money(tp)}
});
document.addEventListener('click',function(e){
  var tb=e.target.closest('[data-tab]');if(tb){S.tab=tb.getAttribute('data-tab');render();return}
  var b=e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
  if(a==='new'){S.run=newRun();S.tab='run';render()}
  else if(a==='addline'){var s=S.staff.filter(function(x){return x.id===b.getAttribute('data-id')})[0];var sf=s.type==='salary'?salFor(s,S.run.start,S.run.end):{amt:'',note:''};S.run.lines.push({empId:s.id,name:s.name,type:s.type,rate:s.rate,otRate:s.otRate,regHrs:'',otHrs:'',base:s.type==='salary'?String(sf.amt):'',reimb:'',deduct:'',note:sf.note,rokar:n(s.rokar)?String(n(s.rokar)):'',bonus:pendBonus(s.id)||''});render()}
  else if(a==='dropline'){S.run.lines.splice(+b.getAttribute('data-i'),1);render()}
  else if(a==='save'||a==='final'){if(a==='final'&&!confirm('Finalise this pay run? It locks the amounts. Nothing goes in the Register until you tap Mark paid.'))return;saveRun(a==='final'?'final':'draft',b)}
  else if(a==='reopen'){if(S.run.status==='paid'&&!confirm('This run is already paid and in the Register. Reopening will not remove those Register lines — fix them there if amounts change. Reopen?'))return;saveRun('draft',b,true)}
  else if(a==='markpaid'){markPaid(b)}
  else if(a==='lnew'){loanForm()}
  else if(a==='ldel'){if(!confirm('Delete this entry? (Any Register line stays — remove it there if needed.)'))return;call('deleteLoan',b.getAttribute('data-id')).then(function(r){take(r);toast('Deleted')}).catch(function(x){toast(x.message,true)})}
  else if(a==='delrun'){if(!confirm('Delete this draft pay run?'))return;call('deleteRun',S.run.runId).then(function(r){S.run=null;take(r);toast('Deleted')}).catch(function(x){toast(x.message,true)})}
  else if(a==='pdf'){pdf(S.run)}
  else if(a==='fillhrs'){var k=fillHours(S.run,false);render();toast(k?'Hours filled for '+k+' staff':'No logged hours in this period',!k)}
  else if(a==='hadd'){addHours(b)}
  else if(a==='hstd'){var st=S.staff.filter(function(x){return x.id===b.getAttribute('data-id')})[0],P=hperiod(),to=P.end<S.today?P.end:S.today;
    var have={};S.hours.forEach(function(x){if(x.empId===st.id)have[x.date]=1});var list=schedDays(st,P.start,to).filter(function(d){return!have[d]}).map(function(d){return{empId:st.id,date:d,start:st.from,end:st.to,hours:stdDay(st),note:'Standard'}});
    if(!list.length){toast('Nothing to add — those days are already logged.');return}
    if(!confirm('Log '+list.length+' standard days ('+r2(list.length*stdDay(st))+' h) for '+st.name+'? You can delete any day they were off.'))return;
    b.disabled=true;call('saveHoursMany',list).then(function(r){take(r);toast('Logged '+list.length+' days')}).catch(function(x){b.disabled=false;toast(x.message,true)})}
  else if(a==='hdel'){var hx=S.hours.filter(function(x){return x.id===b.getAttribute('data-id')})[0]||{};if(!confirm(/^Standard/.test(hx.note||'')&&n(hx.hours)?'Mark '+fmtD(hx.date)+' as a day off?':hx.note==='Off'?'Undo the day off? The standard hours come back.':'Delete this time entry?'))return;call('deleteHours',b.getAttribute('data-id')).then(function(r){take(r);toast('Deleted')}).catch(function(x){toast(x.message,true)})}
  else if(a==='staff'){staffForm(S.staff.filter(function(x){return x.id===b.getAttribute('data-id')})[0]||null)}
  else if(a==='openrun'){var r=runs().filter(function(x){return x.runId===b.getAttribute('data-id')})[0];if(r){S.run=clone(r);S.tab='run';render()}}
});
function saveRun(status,b,reopen){
  var R=S.run;b.disabled=true;
  return call('saveRun',{runId:R.runId,start:R.start,end:R.end,payDate:R.payDate,status:status,reopen:!!reopen,lines:R.lines}).then(function(r){
      take(r);S.run=clone(runs().filter(function(x){return x.runId===r.runId})[0]||R);render();
      toast(status==='final'?'Finalised':status==='paid'?'Marked paid':reopen?'Reopened':'Saved');return r})
    .catch(function(x){b.disabled=false;toast(x.message,true)});
}
function regBal(){return JR.rpc('reg','boot',['']).then(function(r){return r.balances||{}}).catch(function(){return null})}
/* Mark paid: shows Chase / Rokar balances, then records every payment in the Register (Chase part on Chase …7081 — matched
   when the bank file is imported — and Rokar part on Rokar), logs loan repayments taken off pay and marks bonuses as paid. */
function markPaid(b){
  var R=S.run,ch=0,rk=0;R.lines.forEach(function(l){var p=calc(l).pay,x=Math.min(Math.max(n(l.rokar),0),p);rk+=x;ch+=p-x});ch=r2(ch);rk=r2(rk);
  b.disabled=true;b.textContent='Checking balances…';
  regBal().then(function(bal){
    var msg='Mark this pay run as paid on '+fmtD(R.payDate||R.end)+'?\n\nChase …7081: '+money(ch)+(bal?' (balance '+money(bal.CH7081||0)+' → '+money((bal.CH7081||0)-ch)+')':'')+
      '\nRokar: '+money(rk)+(bal?' (balance '+money(bal.CASH||0)+' → '+money((bal.CASH||0)-rk)+')':'')+
      (bal&&((bal.CASH||0)-rk<0)?'\n\n⚠ Rokar would go below zero.':'')+(bal&&((bal.CH7081||0)-ch<0)?'\n\n⚠ Chase would go below zero.':'')+
      '\n\nThis records '+R.lines.length+' payments in the Register.';
    b.disabled=false;b.textContent='Mark paid';
    if(!confirm(msg))return;
    b.disabled=true;b.textContent='Recording…';
    return logToRegister(R).then(function(k){return loanUpdates(R).then(function(){return k})}).then(function(k){return saveRun('paid',b).then(function(){if(k)toast('Paid · '+k+' payments in the Register')})});
  }).catch(function(x){b.disabled=false;b.textContent='Mark paid';toast(x.message,true)});
}
function loanUpdates(R){
  var date=R.payDate||R.end,jobs=[];
  R.lines.forEach(function(l){var bal=loanBal(l.empId),d=Math.min(n(l.deduct),bal);
    if(d>0)jobs.push({kind:'repay',empId:l.empId,date:date,amount:d,account:'Payroll',note:'Taken off pay '+fmtD(R.start)+' – '+fmtD(R.end),runId:R.runId||'run'});
    S.loans.filter(function(x){return x.kind==='bonus'&&x.empId===l.empId&&!x.runId}).forEach(function(x){if(n(l.bonus)>0)jobs.push({id:x.id,kind:'bonus',empId:x.empId,date:x.date,amount:x.amount,account:x.account,note:x.note,runId:R.runId||'run'})})});
  return jobs.reduce(function(p,j){return p.then(function(){return call('saveLoan',j).then(take)})},Promise.resolve());
}
/* On Mark paid: add each person's net pay to the Register — Chase part to Chase checking (matched when the bank file is
   imported, not added twice) and the Rokar part to the Rokar (cash) account. Lines already logged are skipped. */
function logToRegister(R){
  var per=fmtD(R.start)+' – '+fmtD(R.end),date=R.payDate||R.end,k=0;
  return R.lines.reduce(function(p,l){return p.then(function(){
    if(l.regIds)return;var pay=calc(l).pay,rk=Math.min(Math.max(n(l.rokar),0),pay),ch=r2(pay-rk),es=[];
    if(ch>0)es.push({date:date,account:'CH7081',dir:'out',amount:ch,category:'Expenses',type:'Payroll',party:l.name,notes:'Payroll '+per,uploadify:'',source:'manual'});
    if(rk>0)es.push({date:date,account:'CASH',dir:'out',amount:rk,category:'Expenses',type:'Payroll',party:l.name,notes:'Payroll '+per+' (Rokar)',uploadify:'',source:'manual'});
    if(!es.length)return;
    return JR.rpc('reg','add',[es]).then(function(r){l.regIds=(r||[]).map(function(x){return x.id}).join(',')||'logged';k+=es.length});
  })},Promise.resolve()).then(function(){return k});
}


/* ---------- hour log ---------- */
function monday(d){var x=new Date(d+'T12:00:00'),k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x.toISOString().slice(0,10)}
function logged(empId,start,end){var wk={},tot=0;S.hours.forEach(function(h){if(h.empId!==empId||h.date<start||h.date>end)return;var w=monday(h.date);wk[w]=(wk[w]||0)+n(h.hours);tot+=n(h.hours)});
  return{total:r2(tot),reg:r2(tot),ot:0,weeks:wk}}
function fillHours(R,onlyEmpty){var k=0;R.lines.forEach(function(l){if(l.type!=='hourly')return;if(onlyEmpty&&(n(l.regHrs)||n(l.otHrs)))return;
  var st=S.staff.filter(function(x){return x.id===l.empId})[0],have={},tot=0,logd=0,std=0;
  S.hours.forEach(function(h){if(h.empId===l.empId&&h.date>=R.start&&h.date<=R.end){have[h.date]=1;tot+=n(h.hours);logd++}});
  if(st)schedDays(st,R.start,R.end).forEach(function(d){if(!have[d]){tot+=stdDay(st);std++}});
  if(!logd&&!std)return;l.regHrs=String(r2(tot));l.otHrs='';l.note=std?(logd?logd+' days logged + '+std+' standard days to come':'Standard hours: '+std+' days × '+stdDay(st)+' h'):'';k++});return k}
function hperiod(){if(S.hp)return S.hp;var R=S.run;if(R&&R.status!=='final')return S.hp={start:R.start,end:R.end};var last=runs()[0];return S.hp=periodOf(last?addDays(last.end,1):S.today)}
function hm(t){var m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):null}
function vHours(){
  var hs=S.staff.filter(function(s){return s.type==='hourly'&&s.active!=='no'});

    '<div><label>Break (minutes)</label><input id="hb" inputmode="numeric" placeholder="0"></div><div><label>Or total hours</label><input id="hh" inputmode="decimal" placeholder="e.g. 8"></div></div>'+

  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">Hours logged</h2><span class="small muted">'+fmtD(P.start)+' – '+fmtD(P.end)+'</span></div>'+
    '<div class="grid"><div><label>From</label><input type="date" data-hp="start" value="'+esc(P.start)+'"></div><div><label>To</label><input type="date" data-hp="end" value="'+esc(P.end)+'"></div></div>';
  hs.forEach(function(s){var g=logged(s.id,P.start,P.end),list=S.hours.filter(function(x){return x.empId===s.id&&x.date>=P.start&&x.date<=P.end}).sort(function(a,b){return a.date<b.date?-1:1});
    h+='<div class="emp" style="margin-top:10px"><div class="hd"><b>'+esc(s.name)+'</b><span><b>'+g.total+' h</b>'+'</span></div>'+(schedText(s)?'<div class="small muted">Standard: '+esc(schedText(s))+' <button type="button" class="btn sm" data-act="hstd" data-id="'+esc(s.id)+'">Log standard hours up to today</button></div>':'')+
      (list.length?'<table>'+list.map(function(x){return'<tr><td>'+fmtD(x.date)+'</td><td class="small muted">'+(x.start&&x.end?esc(x.start)+'–'+esc(x.end):'')+(x.note?' · '+esc(x.note):'')+'</td><td class="r"><b>'+(x.note==='Off'?'Off':esc(x.hours)+' h')+'</b></td><td class="r"><button type="button" class="btn sm" data-act="hdel" data-id="'+esc(x.id)+'" title="'+(x.note==='Off'?'Undo day off':/^Standard/.test(x.note)?'Mark day off':'Delete')+'">'+(x.note==='Off'?'↺':'✕')+'</button></td></tr>'}).join('')+'</table>':'<div class="small muted">No hours logged in this period.</div>')+
      Object.keys(g.weeks).sort().map(function(w){return'<div class="small muted">Week of '+fmtD(w)+': '+r2(g.weeks[w])+' h</div>'}).join('')+'</div>'});
  return h+'<div class="small muted" style="margin-top:8px">Standard days are logged automatically at the end of each week. Tap ✕ on a day to mark it off. "Fill hours from log" on the pay run copies these in.</div></div>';

function addHours(b){
  var s=$('hs').value,f=$('hf').value,hrs=n($('hh').value);
  if(!hrs&&hm(s)!=null&&hm(f)!=null){var mins=hm(f)-hm(s);if(mins<0)mins+=1440;hrs=r2((mins-n($('hb').value))/60)}
  if(!(hrs>0)){toast('Enter start and end times, or the hours.',true);return}
  S.hlast=$('he').value;S.hdate=$('hd').value;b.disabled=true;
  call('saveHours',{empId:$('he').value,date:$('hd').value,start:s,end:f,hours:hrs,note:$('hn').value}).then(function(r){take(r);toast('Logged '+hrs+' h')}).catch(function(x){b.disabled=false;toast(x.message,true)});
}

function jspdf(){return window.jspdf?Promise.resolve(window.jspdf):new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=function(){res(window.jspdf)};s.onerror=function(){rej(new Error('Could not load the PDF maker.'))};document.head.appendChild(s)})}
function pdf(R){
  jspdf().then(function(J){
    var doc=new J.jsPDF({unit:'pt',format:'letter'}),W=612,per=fmtD(R.start)+' – '+fmtD(R.end);
    function head(t){doc.setFont('times','bold');doc.setFontSize(20);doc.text('Jupiter Rain, Inc.',50,60);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('580 5th Avenue, Floor 21, New York, NY 10036',50,76);doc.setFontSize(14);doc.setFont('helvetica','bold');doc.text(t,50,110);doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Pay period '+per+'   ·   Pay date '+fmtD(R.payDate)+(R.status!=='final'?'   ·   DRAFT':''),50,126)}
    function line(y,a,b,bold){doc.setFont('helvetica',bold?'bold':'normal');doc.text(a,50,y);doc.text(b,W-50,y,{align:'right'})}
    head('Payroll summary');var y=160,tg=0,tp=0;line(y,'Name','Earned  /  Net pay',true);y+=18;
    R.lines.forEach(function(l){var c=calc(l);tg+=c.gross;tp+=c.pay;line(y,l.name,money(c.gross)+'  /  '+money(c.pay));y+=16});
    y+=6;line(y,'Total',money(tg)+'  /  '+money(tp),true);y+=24;doc.setFontSize(9);doc.text('All amounts are net to the employee.',50,y);
    R.lines.forEach(function(l){var c=calc(l),hr=l.type==='hourly';doc.addPage();head('Payslip — '+l.name);var y=160;doc.setFontSize(11);
      if(hr){line(y,'Hours: '+n(l.regHrs)+' × '+money(l.rate),money(n(l.regHrs)*n(l.rate)));y+=18}
      else{line(y,'Salary',money(c.base));y+=18}
      if(n(l.bonus)){line(y,'Bonus',money(l.bonus));y+=18}
      line(y,'Earned',money(c.gross),true);y+=24;
      if(n(l.reimb)){line(y,'Reimbursement',money(l.reimb));y+=18}
      if(n(l.deduct)){line(y,'Advance / deduction','−'+money(l.deduct));y+=18}
      line(y,'Net pay',money(c.pay),true);y+=24;
      if(l.note){doc.setFont('helvetica','normal');doc.text('Note: '+l.note,50,y)}});
    var name='Payroll '+R.start+' to '+R.end+'.pdf',blob=doc.output('blob');
    var f=new File([blob],name,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:name}).catch(function(){});
    else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
  }).catch(function(e){toast(e.message,true)});
}

load();
})();
</script>
