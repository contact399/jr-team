<!DOCTYPE html>
<html lang="en">
<head>
<title>JR Team · Register</title><script>window.JR_MOD="reg";</script><script src="jr.js"></script>
<script src="register-core.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta name="theme-color" content="#24508f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b1d21;--muted:#62666d;--line:#e3e1dc;--gold:#a8790f;--gold-soft:#f6ecd4;--navy:#1f3864;
  --ok:#1d7a46;--ok-soft:#e3f3e9;--warn:#8a4b00;--warn-soft:#fdf0dc;--bad:#b3261e;--bad-soft:#fbe6e4;--blue-soft:#e4ecfa}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--card:#1e2023;--ink:#ecebe8;--muted:#a2a6ad;--line:#30333a;--gold:#e0b34d;--gold-soft:#3a3020;
  --navy:#9db4e0;--ok:#6fcf97;--ok-soft:#1b3326;--warn:#f0b35c;--warn-soft:#3a2c17;--bad:#f28b82;--bad-soft:#3d2120;--blue-soft:#22304a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
header{padding:14px 14px 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:980px;margin:0 auto}
header h1{font-size:19px;margin:0;font-weight:700}
header .sp{flex:1}
select,input,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
textarea{min-height:64px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
nav.tabs{display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;position:sticky;top:calc(46px + env(safe-area-inset-top,0px));background:var(--bg);z-index:5;max-width:980px;margin:0 auto}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:10px;font-weight:600;font-size:14px}
nav.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){nav.tabs button.on{color:#141517}}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;margin-left:4px}
main{padding:0 12px calc(90px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h2{font-size:15px;margin:0 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:560px){.row3{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:var(--gold);color:#fff;font-weight:700;font-size:15px;padding:11px 14px;min-height:44px;cursor:pointer}
.btn.full{width:100%;margin-top:12px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ok{background:var(--ok)} .btn.sm{font-size:13px;padding:7px 10px;min-height:36px}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:14px}
.seg button.on{border:2px solid var(--gold);background:var(--gold-soft);font-weight:700}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx .p{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .m{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.in{color:var(--ok)} .out{color:var(--bad)}
.pill{display:inline-block;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700;background:var(--blue-soft);color:var(--navy)}
.pill.s{background:var(--ok-soft);color:var(--ok)} .pill.b{background:var(--gold-soft);color:var(--warn)} .pill.r{background:var(--bad-soft);color:var(--bad)}
.desc{font:12px/1.35 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);word-break:break-word;margin:4px 0}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;margin:8px 0}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.warn{background:var(--warn-soft);color:var(--warn)} .msg.bad{background:var(--bad-soft);color:var(--bad)} .msg.info{background:var(--blue-soft);color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat .n{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
tr.tot td{font-weight:800;border-top:2px solid var(--ink)}
.muted{color:var(--muted)} .small{font-size:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:999px;padding:14px 20px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.sheet .box{border-radius:18px}}
.sheet h3{margin:0 0 8px;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.hidden{display:none}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Register</h1>
  <span class="sp"></span>
  <select id="year" aria-label="Year" style="width:auto"></select>
  <button type="button" class="btn ghost sm" data-act="reload" aria-label="Refresh">Refresh</button>
</header>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<main id="main"><div class="loading">Loading the register…</div></main>
<button type="button" class="btn fab" data-act="add">+ Add</button>
<script>
(function(){
'use strict';
var C = window.JRReg, S = { tab: 'review', rows: [], accounts: [], rules: [], years: [], counts: {}, balances: {}, loans: [], imports: [] };
var F = { acct: '', cat: '', month: '', q: '', upl: 'to_record', limit: 200 };
var $ = function (id) { return document.getElementById(id); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n, sign){ var v = Math.abs(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); return (sign ? (Number(n) < 0 ? '−$' : '+$') : (Number(n) < 0 ? '−$' : '$')) + v; }
function signed(r){ return (r.dir === 'in' ? 1 : -1) * Number(r.amount || 0); }
function call(fn){ var a = [].slice.call(arguments, 1); return JR.rpc('reg', fn, a); }
function toast(t, bad){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; if (bad) d.style.background = 'var(--bad)'; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, bad ? 5000 : 2500); }
function acct(k){ for (var i = 0; i < S.accounts.length; i++) if (S.accounts[i].key === k) return S.accounts[i]; return { key: k, name: k, kind: 'checking' }; }
function aname(k){ var a = acct(k); return a.name || k; }
function short(k){ var a = acct(k); return a.kind === 'cash' ? 'Cash' : (a.bank === 'Bank of America' ? 'BofA' : a.bank || k) + (a.last4 ? ' …' + a.last4 : ''); }
function today(){ return S.today || new Date().toISOString().slice(0,10); }
function upsert(list){ (list||[]).forEach(function(r){ var i = S.rows.findIndex(function(x){ return x.id === r.id; }); if (i >= 0) S.rows[i] = r; else S.rows.push(r);
  if (r.category === 'Loans' || r.category === 'Paid for others') { var j = S.loans.findIndex(function(x){ return x.id === r.id; }); if (j >= 0) S.loans[j] = r; else S.loans.push(r); } }); recount(); }
function recount(){ S.counts.review = S.rows.filter(function(r){ return r.status !== 'void' && r.review === '1'; }).length;
  S.counts.uploadify = S.rows.filter(function(r){ return r.status !== 'void' && (r.uploadify === 'to_record' || /^bill_(expense|nonstock)$/.test(r.uploadify)); }).length; }
function rulesForMatch(){ // user rules first
  return S.rules.slice().sort(function(a,b){ return (b.priority === 'user') - (a.priority === 'user'); }); }

/* ---------- load ---------- */
function load(year){
  $('main').innerHTML = '<div class="loading">Loading the register…</div>';
  return call('boot', year || '').then(function(r){
    S.rows = r.rows; S.accounts = r.accounts.sort(function(a,b){ return (a.order||99)-(b.order||99); }); S.rules = r.rules;
    S.years = r.years; S.year = r.year; S.counts = r.counts; S.balances = r.balances; S.loans = r.loans || []; S.imports = r.imports || [];
    S.sheetUrl = r.sheetUrl; S.today = r.today;
    var ys = S.years.slice(); if (ys.indexOf(String(new Date().getFullYear())) < 0) ys.push(String(new Date().getFullYear()));
    $('year').innerHTML = ys.sort().reverse().map(function(y){ return '<option' + (y === S.year ? ' selected' : '') + '>' + y + '</option>'; }).join('');
    if (S.tab === 'review' && !S.counts.review) S.tab = 'register';
    render();
  }).catch(function(e){ $('main').innerHTML = '<div class="msg bad">' + esc(e.message) + '</div><button type="button" class="btn" data-act="reload">Try again</button>'; });
}
$('year').addEventListener('change', function(){ load(this.value); });

/* ---------- tabs ---------- */
var TABS = [['review','Review'],['register','Register'],['uploadify','Uploadify'],['cash','Cash'],['loans','Loans & owed'],['import','Import'],['reports','Reports'],['accounts','Accounts']];
function renderTabs(){
  $('tabs').innerHTML = TABS.map(function(t){
    var n = t[0] === 'review' ? S.counts.review : t[0] === 'uploadify' ? S.counts.uploadify : 0;
    return '<button type="button" data-tab="' + t[0] + '"' + (S.tab === t[0] ? ' class="on" aria-current="page"' : '') + '>' + t[1] + (n ? '<span class="badge">' + n + '</span>' : '') + '</button>';
  }).join('');
}
function render(){ renderTabs(); var f = VIEWS[S.tab] || VIEWS.register; $('main').innerHTML = f(); window.scrollTo(0, 0); after(); }
function after(){ var fi = $('files'); if (fi) fi.addEventListener('change', function(){ readFiles(this.files); }); }

/* ---------- a transaction line ---------- */
function pillFor(r){
  var c = r.category || 'Not sorted', cls = c === 'Sales' ? 's' : c === 'Bills' ? 'b' : !r.category ? 'r' : '';
  return '<span class="pill ' + cls + '">' + esc(c) + '</span>';
}
function txLine(r, extra){
  return '<div class="tx" data-act="edit" data-id="' + esc(r.id) + '">' +
    '<div class="p">' + esc(r.party || r.description || '—') + '</div>' +
    '<div class="a ' + r.dir + '">' + (r.dir === 'in' ? '+' : '−') + money(r.amount).replace('$','$') + '</div>' +
    '<div class="m">' + esc(r.date) + ' · ' + esc(short(r.account)) + ' · ' + pillFor(r) + (r.type ? ' ' + esc(r.type) : '') + (r.uploadify === 'to_record' ? ' · <b>to Uploadify</b>' : /^bill_(expense|nonstock)$/.test(r.uploadify) ? ' · <b>Uploadify bill queued</b>' : r.uploadify === 'bill_done' ? ' · Uploadify bill entered' : '') + '</div>' +
    '<div class="r">' + (extra || '') + '</div></div>';
}

/* ---------- views ---------- */
var VIEWS = {};
VIEWS.review = function(){
  var list = S.rows.filter(function(r){ return r.status !== 'void' && r.review === '1'; }).sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  if (!list.length) return '<div class="msg ok">Nothing to review. Everything is sorted.</div>';
  var h = '<div class="msg info">These lines need a decision. Check the suggestion, change it if needed, then tap OK. Tick “Always” to remember the name for next time.</div>' +
    '<button type="button" class="btn ghost sm" data-act="acceptAll" style="margin-bottom:10px">OK all ' + list.length + ' as suggested</button>';
  return h + list.slice(0, 80).map(reviewCard).join('') + (list.length > 80 ? '<div class="muted small">Showing 80 of ' + list.length + '. Sort these and the rest will show.</div>' : '');
};
function catSelect(id, val){ return '<select id="' + id + '" data-cat-for="' + id + '">' + ['<option value="">— pick —</option>'].concat(C.CATEGORIES.map(function(c){ return '<option' + (c === val ? ' selected' : '') + '>' + esc(c) + '</option>'; })).join('') + '</select>'; }
var DEF_TYPE = { 'Expenses': 'Other', 'Sales': 'Sales receipt', 'Bills': 'Supplier invoice', 'Other income / refunds': 'Other', 'Owner / personal': 'Owner draw', 'Transfers': 'Between own accounts' };
function defType(cat){ return DEF_TYPE[cat] || (C.TYPES[cat] || [''])[0]; }
function typeSelect(id, cat, val){ var t = (C.TYPES[cat] || []).slice(); if (val && t.indexOf(val) < 0) t.unshift(val); return '<select id="' + id + '">' + ['<option value=""></option>'].concat(t.map(function(x){ return '<option' + (x === val ? ' selected' : '') + '>' + esc(x) + '</option>'; })).join('') + '</select>'; }
function reviewCard(r){
  var k = C.keyOf(r.description), why = r.notes && /^Suggested:/.test(r.notes) ? r.notes.replace(/^Suggested:\s*/, '') : '';
  return '<div class="card" id="rv-' + esc(r.id) + '">' +
    '<div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(r.date) + ' · ' + esc(short(r.account)) + '</b><b class="' + r.dir + '">' + (r.dir === 'in' ? '+' : '−') + money(r.amount) + '</b></div>' +
    '<div class="desc">' + esc(r.description) + '</div>' + (why ? '<div class="small muted">' + esc(why) + '</div>' : '') +
    '<div class="row"><div><label>Category</label>' + catSelect('c-' + r.id, r.category) + '</div><div><label>Type</label>' + typeSelect('t-' + r.id, r.category, r.type) + '</div></div>' +
    '<label>Who (customer / vendor / person)</label><input id="p-' + esc(r.id) + '" value="' + esc(r.party) + '">' +
    (k ? '<label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);margin-top:10px"><input type="checkbox" id="a-' + esc(r.id) + '" style="width:auto"> Always do this for “' + esc(k) + '”</label>' : '') +
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button type="button" class="btn ok" data-act="reviewOk" data-id="' + esc(r.id) + '">OK</button>' +
    '<button type="button" class="btn ghost" data-act="edit" data-id="' + esc(r.id) + '">More…</button></div></div>';
}

VIEWS.register = function(){
  var months = {}, list = S.rows.filter(function(r){ return r.date.slice(0,4) === S.year; });
  list.forEach(function(r){ months[r.date.slice(0,7)] = 1; });
  var q = F.q.toLowerCase(), shown = list.filter(function(r){
    if (F.acct && r.account !== F.acct) return false;
    if (F.cat === '__void') { if (r.status !== 'void') return false; } else if (r.status === 'void') return false;
    if (F.cat && F.cat !== '__void' && r.category !== F.cat) return false;
    if (F.month && r.date.slice(0,7) !== F.month) return false;
    if (q && (r.party + ' ' + r.description + ' ' + r.notes + ' ' + r.ref + ' ' + r.amount).toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1); });
  var tin = 0, tout = 0; shown.forEach(function(r){ if (r.dir === 'in') tin += Number(r.amount); else tout += Number(r.amount); });
  return '<div class="card"><div class="row3">' +
    '<div><label>Account</label><select data-f="acct"><option value="">All accounts</option>' + S.accounts.map(function(a){ return '<option value="' + esc(a.key) + '"' + (F.acct === a.key ? ' selected' : '') + '>' + esc(a.name) + '</option>'; }).join('') + '</select></div>' +
    '<div><label>Category</label><select data-f="cat"><option value="">All categories</option>' + C.CATEGORIES.map(function(c){ return '<option' + (F.cat === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '<option value="__void"' + (F.cat === '__void' ? ' selected' : '') + '>Voided</option></select></div>' +
    '<div><label>Month</label><select data-f="month"><option value="">All of ' + esc(S.year) + '</option>' + Object.keys(months).sort().reverse().map(function(m){ return '<option' + (F.month === m ? ' selected' : '') + '>' + m + '</option>'; }).join('') + '</select></div>' +
    '</div><label>Search</label><input data-f="q" value="' + esc(F.q) + '" placeholder="Name, amount, check #…"></div>' +
    '<div class="stats"><div class="stat"><div class="l">Lines</div><div class="n">' + shown.length + '</div></div><div class="stat"><div class="l">Money in</div><div class="n in">' + money(tin) + '</div></div><div class="stat"><div class="l">Money out</div><div class="n out">' + money(tout) + '</div></div></div>' +
    '<div style="display:flex;gap:8px;margin-bottom:10px"><button type="button" class="btn ghost sm" data-act="csv">Download these as CSV</button></div>' +
    (shown.length ? '<div class="card">' + shown.slice(0, F.limit).map(function(r){ return txLine(r, r.ref ? esc(r.ref) : ''); }).join('') + '</div>' +
      (shown.length > F.limit ? '<button type="button" class="btn ghost full" data-act="more">Show more (' + (shown.length - F.limit) + ' left)</button>' : '')
      : '<div class="msg info">No lines match. ' + (S.year === String(new Date().getFullYear()) && !list.length ? 'Import this year’s bank files on the Import tab to fill it.' : '') + '</div>');
};

VIEWS.uploadify = function(){
  if (F.upl === 'bills' || F.upl === 'billsDone') return uplChips() + uplBills();
  var list = S.rows.filter(function(r){ return r.status !== 'void' && (r.category === 'Sales' || r.category === 'Bills') && (r.uploadify === 'to_record' || r.uploadify === 'recorded'); });
  var shown = list.filter(function(r){ return F.upl === 'payout' ? r.type === 'Platform payout' && r.uploadify === 'to_record' : F.upl === 'recorded' ? r.uploadify === 'recorded' : r.uploadify === 'to_record' && r.type !== 'Platform payout'; })
    .sort(function(a,b){ return F.upl === 'recorded' ? (a.date < b.date ? 1 : -1) : (a.date > b.date ? 1 : -1); });
  var tin = 0, tout = 0; shown.forEach(function(r){ if (r.dir === 'in') tin += Number(r.amount); else tout += Number(r.amount); });
  return uplChips() +
    '<div class="msg warn">' + (F.upl === 'recorded' ? 'Recorded in Uploadify: ' : 'Waiting for Uploadify: ') + money(tin) + ' in (sales) · ' + money(tout) + ' out (bills) · ' + shown.length + ' lines</div>' +
    (shown.length ? shown.slice(0, 300).map(function(r){
      return '<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(r.party || '—') + '</b><b class="' + r.dir + '">' + (r.dir === 'in' ? '+' : '−') + money(r.amount) + '</b></div>' +
        '<div class="small muted">' + pillFor(r) + ' ' + esc(r.type) + ' · ' + esc(r.date) + ' · ' + esc(short(r.account)) + (r.ref ? ' · ' + esc(r.ref) : '') + '</div>' +
        '<div class="desc">' + esc(r.description) + '</div>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (r.uploadify === 'to_record' ? '<button type="button" class="btn ok sm" data-act="recorded" data-id="' + esc(r.id) + '">Mark recorded in Uploadify</button>' : '<button type="button" class="btn ghost sm" data-act="unrecord" data-id="' + esc(r.id) + '">Undo · back to queue</button>') +
        '<button type="button" class="btn ghost sm" data-act="edit" data-id="' + esc(r.id) + '">Edit</button></div></div>';
    }).join('') : '<div class="msg ok">Nothing here.</div>');
};
function uplChips(){
  var nP = S.rows.filter(function(r){ return r.status !== 'void' && r.type === 'Platform payout' && r.uploadify === 'to_record'; }).length;
  var nB = S.rows.filter(function(r){ return r.status !== 'void' && /^bill_(expense|nonstock)$/.test(r.uploadify); }).length;

function csvOf(rows){
  var head = ['Date','Month','Account','In / Out','Amount','Signed amount','Category','Type','Customer / vendor / payee','Description (from statement)','Notes','Ref','Uploadify'];
  function q(v){ v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  return [head].concat(rows.map(function(r){ return [r.date, r.date.slice(0,7), aname(r.account), r.dir === 'in' ? 'In' : 'Out', Number(r.amount).toFixed(2), signed(r).toFixed(2), r.category, r.type, r.party, r.description, r.notes, r.ref, r.uploadify]; }))
    .map(function(l){ return l.map(q).join(','); }).join('\r\n');
}
function download(name, text){ var b = new Blob(['﻿' + text], { type: 'text/csv' }), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ---------- full backup ---------- */
function backupAll(btn){
  var years = S.years.slice(); if (!years.length) years = [S.year];
  btn.disabled = true; var all = [], i = 0;
  function next(){
    if (i >= years.length) return Promise.resolve();
    var y = years[i++]; btn.textContent = 'Getting ' + y + '…';
    return call('yearRows', y).then(function(r){ all = all.concat(r); return next(); });
  }
  next().then(function(){
    var cols = ['id','date','account','dir','amount','category','type','party','description','notes','ref','uploadify','review','billed','status','source','hash','link','addedAt','updatedAt'];
    function q(v){ v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
    all.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.id < b.id ? -1 : 1); });
    var stamp = today();
    download('JR Register backup ' + stamp + ' - all lines.csv', [cols.join(',')].concat(all.map(function(r){ return cols.map(function(c){ return q(r[c]); }).join(','); })).join('\r\n'));
    var acols = ['key','name','bank','kind','personal','last4','lastBalance','lastBalanceDate','lastImport'];
    var lines = ['ACCOUNTS', acols.join(',')].concat(S.accounts.map(function(a){ return acols.map(function(c){ return q(a[c]); }).join(','); }))
      .concat(['', 'RULES', 'key,match,category,type,party,priority'], S.rules.map(function(r){ return [r.key, r.match, r.category, r.type, r.party, r.priority].map(q).join(','); }));
    setTimeout(function(){ download('JR Register backup ' + stamp + ' - accounts and rules.csv', lines.join('\r\n')); }, 800);
    try { localStorage.setItem('jr_reg_backup', stamp); } catch (e) {}
    S.lastBackup = stamp; toast('Downloaded ' + all.length + ' lines'); render();
  }).catch(function(x){ toast(x.message, 1); btn.disabled = false; btn.textContent = 'Download everything'; });
}

    b.parentNode.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });

    return hint();
  }
  if (act === 'addSave') return addSave(b);
  if (act === 'close') return closeSheet();
  if (act === 'edit') return editForm(id);

  if (act === 'more') { F.limit += 300; return render(); }
  if (act === 'impSave') return impSave(Number(b.getAttribute('data-i')), b);
  if (act === 'acctEdit') return acctForm(b.getAttribute('data-k'));
  if (act === 'acctSave') return acctSave(b);
  if (act === 'ruleDel') { var k = b.getAttribute('data-k'), m = b.getAttribute('data-m'); if (!confirm('Remove the rule for “' + k + '”?')) return; return call('deleteRule', k, m).then(function(){ S.rules = S.rules.filter(function(r){ return !(r.key === k && r.match === m); }); render(); }); }
  if (act === 'backup') return backupAll(b);
  if (act === 'csv' || act === 'csvYear') {
    var rows = act === 'csvYear' ? S.rows.filter(function(r){ return r.date.slice(0,4) === S.year && r.status !== 'void'; }) : S.rows.filter(function(r){ return r.date.slice(0,4) === S.year && (F.cat === '__void' ? r.status === 'void' : r.status !== 'void') && (!F.acct || r.account === F.acct) && (!F.cat || F.cat === '__void' || r.category === F.cat) && (!F.month || r.date.slice(0,7) === F.month); });
    rows.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
    return download('Jupiter Rain register ' + S.year + (F.month && act === 'csv' ? ' ' + F.month : '') + '.csv', csvOf(rows));
  }
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.hasAttribute('data-f')) { F[el.getAttribute('data-f')] = el.value; F.limit = 200; return render(); }
  if (el.hasAttribute('data-imp-acct')) { var info = IMP[Number(el.getAttribute('data-imp-acct'))]; info.account = el.value; info.saved = 0; info.result = ''; info.preparedFor = ''; return showImport(); }
  if (el.hasAttribute('data-cat-for')) {         // category changed → refresh its type list
    var tid = el.id.replace(/^c-/, 't-').replace(/^f-cat$/, 'f-type').replace(/^e-cat$/, 'e-type'), te = $(tid);
    if (te) te.outerHTML = typeSelect(tid, el.value, defType(el.value));
    return hint();
  }
  if (el.id === 'f-acct') hint();
});
var qt; document.addEventListener('input', function(e){ if (e.target.getAttribute('data-f') === 'q') { clearTimeout(qt); var v = e.target.value; qt = setTimeout(function(){ F.q = v; render(); var i = document.querySelector('[data-f=q]'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 350); } });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeSheet(); });

try { S.lastBackup = localStorage.getItem('jr_reg_backup') || ''; } catch (e) {}
load();
})();
</script>
