<!DOCTYPE html>
<html>
<head>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>JR Team · Bins</title><script>window.JR_MOD="bins";</script><script src="jr.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<meta name="theme-color" content="#24508f"><link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta charset="utf-8">
<script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--bg:#f6f5f2;--card:#fff;--gold:#a16207;
        --green:#15803d;--green-bg:#dcfce7;--red:#b91c1c;--red-bg:#fee2e2;--amber:#b45309;--amber-bg:#fef3c7;--blue:#1d4ed8;--blue-bg:#dbeafe}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{font-weight:700;letter-spacing:.04em}
  .toggle{display:flex;background:#374151;border-radius:999px;padding:3px;margin-left:auto}
  .toggle a{color:#d1d5db;text-decoration:none;padding:7px 14px;border-radius:999px;font-size:15px;font-weight:600}
  .toggle a.on{background:#fff;color:var(--ink)}
  #who{width:100%;font-size:13px;color:#9ca3af}
  main{padding:14px;max-width:640px;margin:0 auto;padding-bottom:80px}
  h2{font-size:22px;margin:4px 0 12px}
  h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:14px;
       font:600 18px/1.2 inherit;font-family:inherit;padding:12px;background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line) inset;cursor:pointer}
  .btn.big{min-height:84px;flex-direction:column;font-size:17px}
  .btn.big .ic{font-size:28px}
  .btn.primary{background:var(--ink);color:#fff;box-shadow:none}
  .btn.green{background:var(--green);color:#fff;box-shadow:none}
  .btn.red{background:var(--red);color:#fff;box-shadow:none}
  .btn.ghost{background:transparent;box-shadow:none;color:var(--mute);min-height:44px}
  .btn.small{min-height:44px;font-size:15px;width:auto;padding:8px 14px}
  .btn:disabled{opacity:.5}
  .row{display:flex;gap:8px;align-items:center}
  .scan{display:flex;gap:8px;margin-bottom:12px}
  .scan input{flex:1;min-width:0;font-size:22px;padding:14px;border-radius:14px;border:2px solid var(--ink);text-transform:uppercase;font-weight:600}
  .scan .btn{width:72px;font-size:26px}
  input,select,textarea{font:inherit;width:100%;padding:13px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
  label{display:block;font-weight:600;margin:14px 0 6px}
  .choices{display:flex;flex-wrap:wrap;gap:8px}
  .choice{flex:1 1 calc(50% - 8px);min-height:54px;border-radius:12px;border:2px solid var(--line);background:#fff;font:600 16px inherit;font-family:inherit;padding:8px;cursor:pointer}
  .choice.sel{border-color:var(--ink);background:var(--ink);color:#fff}
  .card{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 0 0 1px var(--line) inset;margin-bottom:10px;display:flex;gap:12px}
  .card .ph{width:84px;height:84px;border-radius:10px;background:#f3f4f6;object-fit:cover;flex:none}
  .card.lg{flex-direction:column}
  .card.lg .ph{width:100%;height:auto;max-height:340px;aspect-ratio:1/1}
  .card .sku{font-weight:700;font-size:18px}
  .card .meta{font-size:14px;color:var(--mute)}
  .card .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#f3f4f6;margin-right:4px}
  .t1{background:#fde68a;color:#78350f}.t2{background:#e5e7eb}.t3{background:#f3f4f6;color:var(--mute)}
  .st-In{background:var(--green-bg);color:var(--green)}.st-With{background:var(--blue-bg);color:var(--blue)}
  .st-Checked{background:var(--amber-bg);color:var(--amber)}.st-On{background:#ede9fe;color:#5b21b6}
  .st-Returned{background:var(--red-bg);color:var(--red)}.st-Sold{background:#e5e7eb;color:var(--mute)}
  .alert{border-radius:16px;padding:12px;margin-bottom:12px}
  .alert.red{background:var(--red-bg);box-shadow:0 0 0 2px var(--red) inset}
  .alert.amber{background:var(--amber-bg)}
  .alert.blue{background:var(--blue-bg)}
  .alert .card{box-shadow:none}
  .msg{padding:14px;border-radius:14px;margin:12px 0;font-weight:600}
  .msg.ok{background:var(--green-bg);color:var(--green)}.msg.bad{background:var(--red-bg);color:var(--red)}.msg.info{background:var(--blue-bg);color:var(--blue)}
  #flash{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:50}
  #flash.g{background:rgba(21,128,61,.35);opacity:1;transition:none}#flash.r{background:rgba(185,28,28,.4);opacity:1;transition:none}
  #toast{position:fixed;left:12px;right:12px;bottom:16px;z-index:60;padding:16px;border-radius:14px;font-weight:600;color:#fff;display:none;text-align:center}
  #toast.g{background:var(--green);display:block}#toast.r{background:var(--red);display:block}#toast.i{background:var(--ink);display:block}
  #cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column;padding:12px;gap:10px}
  #cam #reader{flex:1;width:100%}
  #cam .note{color:#fff;text-align:center}
  .hidden{display:none!important}
  .hist{font-size:14px;border-left:3px solid var(--line);padding:2px 0 10px 12px;margin-left:4px}
  .hist b{font-size:15px}
  .count-item{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);background:#fff}
  .count-item .mark{font-size:22px;width:28px;text-align:center}
  .count-item.ok{background:var(--green-bg)}
  .bar{height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin:6px 0 12px}
  .bar div{height:100%;background:var(--green);transition:width .3s}
  .photo-prev{width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:8px;background:#f3f4f6}
  .req{color:var(--red);font-weight:700}
  .loading{padding:40px;text-align:center;color:var(--mute)}
  .foot{font-size:13px;color:var(--mute);margin-top:22px}
/* ===== Cleaner look ===== */
:root{--ink:#16201B;--mute:#4A5A52;--line:#D3D9D2;--bg:#F2F4F1;--card:#fff;--acc:#1E5A47;--acc-soft:#E3EFEA;
      --green:#1D6B3F;--green-bg:#DFF0E5;--red:#8A3A16;--red-bg:#FCEFE7;--amber:#7A4E0E;--amber-bg:#FBF1DC;--blue:#1E4E79;--blue-bg:#E4EEF7}
body{font:16px/1.45 "Public Sans",-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:12px 16px 10px;gap:10px}
.brand{font-size:13px;letter-spacing:.12em}
#who{order:2;width:auto;margin-left:auto;color:var(--mute);font-size:14px}
.toggle{order:3;width:100%;margin:0;background:#EEF1ED;border-radius:12px;padding:4px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
.toggle a{color:var(--mute);text-align:center;border-radius:9px;padding:9px 6px;font-size:15px}
.toggle a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:700}
main{padding:16px}
h2{font-size:21px}
h3{font-size:13px;letter-spacing:.05em;color:var(--mute)}
.btn{min-height:52px;border-radius:12px;font-size:16px;box-shadow:0 0 0 1px var(--line) inset}
.btn.big{min-height:64px;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 14px;font-size:16px}
.btn.big svg{flex:none}
.grid .btn.big:first-child{background:var(--acc);color:#fff;box-shadow:none}
.btn.primary{background:var(--acc)}
.btn.red{background:#A4471C}
.btn.green{background:var(--green)}
.btn.ghost{color:var(--acc);font-weight:600}
.scan input{border-color:var(--acc);font-size:20px}
.choice.sel{border-color:var(--acc);background:var(--acc)}
.card{border-radius:14px;box-shadow:0 0 0 1px var(--line) inset}
.card .ph{width:64px;height:64px}
.card .sku{font-size:16px}
.alert{border-radius:14px}
.alert.red{background:var(--red-bg);box-shadow:0 0 0 1px #F0CDB8 inset;color:var(--red)}
.alert.amber{box-shadow:0 0 0 1px #EBD7AE inset}
.alert.blue{box-shadow:0 0 0 1px #C6D8EA inset}
.msg{border-radius:12px;font-weight:600}
#toast.i{background:var(--ink)}#toast.g{background:var(--green)}#toast.r{background:#A4471C}
.cl-list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:14px 0}
.cl-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--mute)}
.cl-head button{all:unset;cursor:pointer;color:var(--acc);font-size:15px;font-weight:600;letter-spacing:0;display:flex;align-items:center;gap:6px;min-height:36px}
.cl-row{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 16px;border-top:1px solid #E1E6E0}
.cl-row b{font-size:16px;font-weight:600}.cl-row span{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:15px}
.cl-alert{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--red-bg);border:1px solid #F0CDB8;border-radius:14px;padding:12px 14px;color:var(--red);margin-bottom:6px}
.cl-alert b{display:block;font-size:16px}.cl-alert small{font-size:14px}
.cl-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.cl-chips span{background:#fff;border:1px solid var(--line);border-radius:20px;padding:5px 10px;font-size:13px;color:var(--mute)}
.cl-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.cl-two .btn{min-height:52px;font-size:15px}
.cl-filter{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-bottom:12px}
.cl-filter input{border:0;padding:12px 0;background:transparent;outline:0}
.cl-item{display:flex;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #E1E6E0}
.cl-item .ph{width:52px;height:52px;border-radius:10px;background:#E7EBE6;object-fit:cover;flex:none}
.cl-item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cl-item .tx b{font-size:16px}.cl-item .tx small{font-size:13px;color:var(--mute)}
.cl-item .btn{width:auto;min-height:40px;padding:0 12px;font-size:14px}

</style>
</head>
<body>
<header>
  <div class="brand">JUPITER RAIN</div>
  <div class="toggle"><a id="tBins" href="#">Bins</a><a id="tImp" href="#">Important Items</a></div>
  <div id="who"></div>
</header>
<main id="app"><div class="loading">Loading…</div></main>
<div id="flash"></div>
<div id="toast"></div>
<div id="cam" class="hidden">
  <div class="note" id="camNote">Point the camera at the barcode or QR code</div>
  <div id="reader"></div>
  <button class="btn" id="camPhotoBtn">📸 Take a photo of the barcode instead</button>
  <button class="btn red" id="camClose">Close camera</button>
</div>
<div id="reader-file" class="hidden"></div>
<input type="file" id="scanFile" accept="image/*" capture="environment" class="hidden">
<input type="file" id="photoFile" accept="image/*" capture="environment" class="hidden">
<input type="file" id="tagFile" accept="image/*" capture="environment" class="hidden">
<div id="pick" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;display:flex;align-items:flex-end"><div id="pickBox" style="background:#fff;width:100%;max-height:80%;overflow:auto;border-radius:18px 18px 0 0;padding:16px"></div></div>

<script>
var APP_URL = "";
var BT_INSTALLED = true;
var MODE = "bins";
var BOOT = null;
var S = null;            // bootstrap data
var cur = {};            // current action state
var photoCache = {};
var $ = function (id) { return document.getElementById(id); };

// ───────── server calls ─────────
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var r = google.script.run.withSuccessHandler(res).withFailureHandler(function (e) { rej(e && e.message ? e : new Error(String(e))); });
    r[fn].apply(r, args);
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').trim().toUpperCase(); }

// ───────── feedback ─────────
function flash(kind) {
  var f = $('flash'); f.className = kind === 'good' ? 'g' : 'r';
  try { navigator.vibrate && navigator.vibrate(kind === 'good' ? 60 : [120, 60, 120]); } catch (e) {}
  setTimeout(function () { f.className = ''; }, 180);
}
var toastT;
function toast(text, kind) {
  var t = $('toast'); t.textContent = text; t.className = kind === 'good' ? 'g' : kind === 'bad' ? 'r' : 'i';
  clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, kind === 'bad' ? 5000 : 3000);
}
function good(t) { flash('good'); if (t) toast(t, 'good'); }
function bad(t) { flash('bad'); if (t) toast(t, 'bad'); }

// ───────── start-up ─────────
function load() {
  return call('II_bootstrap').then(applyBoot);
}
function applyBoot(d) {
    S = d;
    $('who').textContent = 'Signed in as ' + d.me.name + (d.me.isAdmin ? ' · Admin' : '') + (d.importantEnabled ? ' · ' + d.total + ' important items' : '') + ' · ' + (d.catalogCount || 0) + ' Uploadify SKUs';
}
function setMode(m) {
  if (S && !S.importantEnabled) { m = 'bins'; document.querySelector('.toggle').classList.add('hidden'); }
  MODE = (m === 'bins' && S && S.bins) ? 'bins' : 'important';
  $('tBins').className = MODE === 'bins' ? 'on' : '';
  $('tImp').className = MODE === 'important' ? 'on' : '';
}
$('tBins').addEventListener('click', function (e) { e.preventDefault(); if (!S || !S.bins) return toast('Bins aren\'t set up yet.', 'info'); setMode('bins'); home(); });
$('tImp').addEventListener('click', function (e) { e.preventDefault(); setMode('important'); home(); });
(BOOT ? Promise.resolve(applyBoot(BOOT)) : load()).then(function () { setMode(MODE); home(); }).catch(function (e) { $('app').innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>'; });

// ───────── small renderers ─────────
function tierPill(t) { var n = String(t || '').replace(/\D/g, ''); return t ? '<span class="pill t' + n + '">' + esc(t) + '</span>' : ''; }
function statusPill(s) { return '<span class="pill st-' + esc(String(s || '').split(/[\s–]/)[0]) + '">' + esc(s) + '</span>'; }
function card(it, actionsHtml, large) {
  var sku = esc(it.SKU);
  var extra = [];
  if (it.Status === 'Checked Out') extra.push('Due back ' + esc(it['Expected Return']) + ' · ' + esc(it['Checkout Reason']));
  if (it['Pending Handoff To']) extra.push('⏳ Hand-off ' + esc(it['Handoff From']) + ' → ' + esc(it['Pending Handoff To']) + ': ' + esc(it['Handoff Reason']));
  if (it['Count Flag']) extra.push('⚠️ ' + esc(it['Count Flag']) + ' at last count');
  if (it['Last Verified']) extra.push('Last verified ' + esc(it['Last Verified']));
  return '<div class="card' + (large ? ' lg' : '') + '"><img class="ph" data-photo="' + sku + '" alt="">' +
    '<div style="flex:1;min-width:0"><div class="sku">' + sku + '</div>' +
    '<div>' + esc(it.Description) + '</div>' +
    '<div style="margin:6px 0">' + tierPill(it['Value Tier']) + statusPill(it.Status) + '</div>' +
    '<div class="meta">' + esc(it._where) + '</div>' +
    (extra.length ? '<div class="meta">' + extra.join('<br>') + '</div>' : '') +
    (actionsHtml ? '<div class="acts">' + actionsHtml + '</div>' : '') + '</div></div>';
}
function loadPhotos(root) {
  (root || document).querySelectorAll('img[data-photo]').forEach(function (img) {
    var sku = img.getAttribute('data-photo');
    if (photoCache[sku]) { img.src = photoCache[sku]; return; }
    call('II_getPhoto', sku).then(function (src) { if (src) { photoCache[sku] = src; img.src = src; } }).catch(function () {});
  });
}
function choices(group, opts, selected) {
  return '<div class="choices" data-group="' + group + '">' + opts.map(function (o) {
    var v = typeof o === 'string' ? o : o.value, l = typeof o === 'string' ? o : o.label;
    return '<button type="button" class="choice' + (v === selected ? ' sel' : '') + '" data-choice="' + esc(v) + '">' + esc(l) + '</button>';
  }).join('') + '</div>';
}
function choiceVal(group) { var b = document.querySelector('[data-group="' + group + '"] .choice.sel'); return b ? b.getAttribute('data-choice') : ''; }
function teamSelect(id, selected, exclude) {
  return '<select id="' + id + '">' + S.team.filter(function (n) { return norm(n) !== norm(exclude); }).map(function (n) {
    return '<option' + (n === selected ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select>';
}

// ───────── HOME ─────────
function home() {
  closeCam();
  cur = {};
  if (MODE === 'bins') return binsHome();
  var h = '';
  if (S.needsLoc.length) {
    h += '<div class="alert red"><h3 style="color:var(--red);margin-top:0">🔴 Returned — needs a location (' + S.needsLoc.length + ')</h3>' +
      S.needsLoc.map(function (it) { return card(it, '<button class="btn red small" data-act="go" data-to="checkin" data-sku="' + esc(it.SKU) + '">Scan &amp; put away</button>'); }).join('') + '</div>';
  }
  if (S.myHandoffs.length) {
    h += '<div class="alert blue"><h3 style="margin-top:0">🤝 Waiting for you to accept</h3>' +
      S.myHandoffs.map(function (it) {
        return card(it, '<button class="btn green small" data-act="accept" data-sku="' + esc(it.SKU) + '">✓ Accept</button>' +
          '<button class="btn small" data-act="decline" data-sku="' + esc(it.SKU) + '">Decline</button>');
      }).join('') + '</div>';
  }
  if (S.overdue.length) {
    h += '<div class="alert amber"><h3 style="margin-top:0">⏰ Overdue (' + S.overdue.length + ')</h3>' +
      S.overdue.map(function (it) { return card(it, '<button class="btn small" data-act="go" data-to="return" data-sku="' + esc(it.SKU) + '">Mark returned</button>'); }).join('') + '</div>';
  }
  if (S.unverified.length) {
    h += '<div class="alert amber"><b>⚠️ ' + S.unverified.length + ' item(s) Unverified at the last count:</b> ' +
      S.unverified.map(function (it) { return esc(it.SKU); }).join(', ') + '</div>';
  }
  h += '<div class="grid">' +
    bigBtn('lookup', '🔍', 'Look Up') + bigBtn('checkin', '📥', 'Check In') +
    bigBtn('checkout', '📤', 'Check Out') + bigBtn('handoff', '🤝', 'Hand Off') +
    bigBtn('return', '↩️', 'Return') + bigBtn('count', '✅', 'Daily Count') +
    (S.me.isAdmin ? bigBtn('mark', '⭐', 'Mark as Important') : '') + bigBtn('locations', '🗄️', 'Locations') + '</div>';
  if (S.sentHandoffs.length) {
    h += '<h3>Hand-offs you started</h3>' + S.sentHandoffs.map(function (it) {
      return card(it, '<button class="btn small" data-act="cancelHandoff" data-sku="' + esc(it.SKU) + '">Cancel hand-off</button>');
    }).join('');
  }
  var c = S.counts;
  h += '<div class="foot">In location ' + (c['In Location'] || 0) + ' · With custodian ' + (c['With Custodian'] || 0) +
    ' · Checked out ' + (c['Checked Out'] || 0) + ' · On memo ' + (c['On Memo'] || 0) + ' · Sold ' + (c['Sold'] || 0) +
    (S.lastSync ? '<br>Last Uploadify sync: ' + esc(S.lastSync) : '') + '</div>';
  $('app').innerHTML = h;
  loadPhotos();
  window.scrollTo(0, 0);
}
// ───────── Cleaner look ─────────
var CL_ICON = {
  putbin: 'M12 4v12M7 11l5 5 5-5M4 20h16', takeout: 'M12 16V4M7 9l5-5 5 5M4 20h16', lookup: 'M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4',
  bins: 'M4 7h16v4H4zM6 11v8h12v-8M10 15h4', checkin: 'M12 4v12M7 11l5 5 5-5M4 20h16', checkout: 'M12 16V4M7 9l5-5 5 5M4 20h16',
  handoff: 'M4 12h12M12 8l4 4-4 4M20 5v14', 'return': 'M9 14l-5-5 5-5M4 9h11a5 5 0 010 10h-3', mark: 'M12 3l2.6 5.6 6 .7-4.5 4 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.5-4 6-.7z',

// Hardware scanners "type" very fast — that's how we tell a scan from typing.
function wireScan(onCode) {
  var inp = $('sku'), first = 0;
  cur.onCode = onCode;
  inp.addEventListener('keydown', function (e) {
    if (!inp.value) first = Date.now();
    if (e.key === 'Enter') {
      e.preventDefault();
      var v = cleanScan(inp.value); if (!v) return;
      var fast = v.length >= 4 && (Date.now() - first) / v.length < 35;

}
function cleanScan(t) {
  t = String(t || '').trim();
  if (/^https?:\/\//i.test(t)) {     // a QR code holding a link: use ?sku= or the last part of the path
    try {
      var u = new URL(t);
      var q = u.searchParams.get('sku') || u.searchParams.get('SKU') || u.searchParams.get('q');
      if (q) return norm(q);
      var parts = u.pathname.split('/').filter(Boolean);
      if (parts.length) return norm(decodeURIComponent(parts[parts.length - 1]));
    } catch (e) {}
  }
  return norm(t);
}

function submit(btn) {
  var a = cur.action, sku = cur.sku, p, fn;
  var v = function (id) { var e = $(id); return e ? e.value.trim() : ''; };
  if (a === 'checkin') {
    if (!choiceVal('loc')) return bad('Pick a location');
    if (cur.needPhoto && !cur.photo) return bad('Take a fresh photo first');
    fn = 'II_checkIn'; p = { sku: sku, location: choiceVal('loc'), custodian: v('custodian'), photo: cur.photo, note: v('note'), source: cur.source };
  } else if (a === 'checkout') {
    var due = $('due').value ? new Date($('due').value).getTime() : 0;
    if (!choiceVal('reason')) return bad('Pick a reason');
    if (!v('dest')) return bad('Where is it going?');
    if (!due) return bad('Set the expected return');
    if (due < Date.now()) return bad('Expected return is in the past');
    fn = 'II_checkOut'; p = { sku: sku, reason: choiceVal('reason'), destination: v('dest'), dueMs: due, holder: v('holder'), note: v('note'), source: cur.source };
  } else if (a === 'handoff') {
    var reason = v('reason') || choiceVal('quick');
    if (!choiceVal('to')) return bad('Who are you handing it to?');
    if (!reason) return bad('Add a reason');
    fn = 'II_handOff'; p = { sku: sku, to: choiceVal('to'), reason: reason, source: cur.source };
  } else if (a === 'return') {
    fn = 'II_return'; p = { sku: sku, note: v('note'), source: cur.source };
  } else if (a === 'mark' && cur.editing) {
    fn = 'II_editItem'; p = { sku: sku, tier: choiceVal('tier'), description: v('desc'), reason: v('note') };
  } else if (a === 'mark') {
    if (!choiceVal('tier')) return bad('Pick a value tier');
    if (!cur.photo) return bad('A photo is required');
    if (!choiceVal('loc')) return bad('Pick where it goes');
    fn = 'II_markImportant'; p = { sku: sku, description: v('desc'), tier: choiceVal('tier'), photo: cur.photo, location: choiceVal('loc'), source: cur.source };
  }
  btn.disabled = true; btn.textContent = 'Saving…';
  call(fn, p).then(function (r) {
    delete photoCache[sku];
    good(r.msg);
    done(r.msg, a, sku);
    load();   // refresh in the background
  }).catch(function (e) {
    bad(e.message); btn.disabled = false; btn.textContent = 'Try again';

  });

  h += '<button class="btn primary" data-act="go" data-to="' + a + '">Next item</button><div style="height:10px"></div>' +
    '<button class="btn" data-act="home">Home</button>';

var CNT = null;

function countStart() {

}
function countBegin() {

  call('II_countList').then(function (list) {
    CNT = { session: session, list: list, ok: {}, extras: [] };
    try { var saved = JSON.parse(localStorage.getItem(todayKey(session)) || 'null'); if (saved) { CNT.ok = saved.ok || {}; CNT.extras = saved.extras || []; } } catch (e) {}
    $('body').innerHTML = '<div class="msg info">' + esc(session) + ' count — scan every item. Keep the camera open to scan one after another.</div>' +
      scanBox() + '<div id="prog"></div><div id="clist"></div>' +
      '<div style="height:14px"></div><button class="btn green" data-act="countFinish">Finish count</button><div id="res"></div>';
    wireScan(countScan);
    renderCount();
    $('sku').focus();
  }).catch(function (e) { $('body').innerHTML = '<div class="msg bad">' + esc(e.message) + '</div>'; });
}
function countScan(code) {
  var sku = cleanScan(code); $('sku').value = '';
  var hit = CNT.list.find(function (x) { return x.sku === sku; });
  if (!hit) { bad(sku + ' is not on today\'s list'); if (CNT.extras.indexOf(sku) < 0) CNT.extras.push(sku); }
  else if (CNT.ok[sku]) { toast(sku + ' already counted', 'info'); }
  else { CNT.ok[sku] = 1; good('✓ ' + sku); }
  try { localStorage.setItem(todayKey(CNT.session), JSON.stringify({ ok: CNT.ok, extras: CNT.extras })); } catch (e) {}
  renderCount();
  if (!qr) $('sku').focus();
}
function renderCount() {
  var n = Object.keys(CNT.ok).filter(function (k) { return CNT.list.some(function (x) { return x.sku === k; }); }).length;
  var tot = CNT.list.length;
  $('prog').innerHTML = '<b>' + n + ' of ' + tot + ' verified</b><div class="bar"><div style="width:' + (tot ? n / tot * 100 : 100) + '%"></div></div>' +
    (CNT.extras.length ? '<div class="msg bad">Scanned but not expected here: ' + esc(CNT.extras.join(', ')) + '</div>' : '');
  var sorted = CNT.list.slice().sort(function (a, b) { return (CNT.ok[a.sku] ? 1 : 0) - (CNT.ok[b.sku] ? 1 : 0); });
  $('clist').innerHTML = sorted.map(function (x) {
    var ok = !!CNT.ok[x.sku];
    return '<div class="count-item' + (ok ? ' ok' : '') + '"><div class="mark">' + (ok ? '✅' : '⬜') + '</div><div><b>' + esc(x.sku) + '</b> ' + tierPill(x.tier) +
      '<div class="meta">' + esc(x.description) + ' · ' + esc(x.where) + '</div></div></div>';
  }).join('') || '<div class="msg info">No items are expected in the office right now.</div>';
}
function countFinish(btn) {
  var missing = CNT.list.filter(function (x) { return !CNT.ok[x.sku]; }).length;
  if (missing && !confirm(missing + ' item(s) not scanned will be flagged Unverified and emailed to Karan. Finish anyway?')) return;
  btn.disabled = true; btn.textContent = 'Saving…';
  call('II_submitCount', { session: CNT.session, verified: Object.keys(CNT.ok).concat(CNT.extras) }).then(function (r) {
    try { localStorage.removeItem(todayKey(CNT.session)); } catch (e) {}
    closeCam();
    r.missing.length ? bad() : good();
    $('body').innerHTML = '<div class="msg ' + (r.missing.length ? 'bad' : 'ok') + '">' + r.verified + ' of ' + r.expected + ' verified.' +
      (r.missing.length ? '<br>Unverified (emailed to Karan):<br>' + r.missing.map(esc).join('<br>') : ' Everything is accounted for.') + '</div>' +
      '<button class="btn" data-act="home">Home</button>';

  }).catch(function (e) { bad(e.message); btn.disabled = false; btn.textContent = 'Finish count'; });
}

  var ch = e.target.closest('.choice');
  if (ch) { ch.parentNode.querySelectorAll('.choice').forEach(function (b) { b.classList.remove('sel'); }); ch.classList.add('sel'); return; }
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act'), sku = b.getAttribute('data-sku');
  if (act === 'home') { home(); return load().then(function () { if (!cur.action) home(); }); }
  if (act === 'go') return start(b.getAttribute('data-to'), sku);
  if (act === 'cam') return openCam();
  if (act === 'tag') return $('tagFile').click();
  if (act === 'pickSku') { $('pick').classList.add('hidden'); return cur.onCode && cur.onCode(b.getAttribute('data-sku'), 'tag'); }
  if (act === 'pickClose') return $('pick').classList.add('hidden');
  if (act === 'takeoutGo') return takeoutSubmit(b);
  if (act === 'addBin') {
    return call('BT_addBin', { name: $('bname').value, notes: $('bnotes').value })
      .then(function (r) { good(r.msg); return load().then(binsManage); }).catch(function (err) { bad(err.message); });
  }
  if (act === 'rmBin') {
    var bn = b.getAttribute('data-name');
    if (!confirm('Remove "' + bn + '" from the list? (It stays in the sheet history.)')) return;
    return call('BT_removeBin', bn).then(function (r) { good(r.msg); return load().then(binsManage); }).catch(function (err) { bad(err.message); });
  }
  if (act === 'photo') return $('photoFile').click();
  if (act === 'submit') return submit(b);
  if (act === 'countBegin') return countBegin();
  if (act === 'countFinish') return countFinish(b);
  if (act === 'accept' || act === 'decline' || act === 'cancelHandoff') {
    b.disabled = true;
    return call('II_respondHandoff', sku, act === 'accept').then(function (r) { good(r.msg); b.closest('.card') && b.closest('.card').remove(); load().then(function () { if (!cur.action) home(); }); })
      .catch(function (err) { bad(err.message); b.disabled = false; });
  }
  if (act === 'addLoc') {
    return call('II_addLocation', { name: $('lname').value, type: choiceVal('ltype'), counted: $('lcount').checked, notes: $('lnotes').value })
      .then(function (r) { good(r.msg); return load().then(locationsScreen); }).catch(function (err) { bad(err.message); });
  }
  if (act === 'rmLoc') {
    var name = b.getAttribute('data-name');
    if (!confirm('Remove "' + name + '" from the list? (It stays in the sheet history.)')) return;
    return call('II_removeLocation', name).then(function (r) { good(r.msg); return load().then(locationsScreen); }).catch(function (err) { bad(err.message); });
  }
  if (act === 'runSync' || act === 'runAlerts') {
    b.disabled = true; var old = b.textContent; b.textContent = 'Running…';
    return call(act === 'runSync' ? 'II_adminRunSync' : 'II_adminRunAlerts').then(function (r) { good(r.msg); return load(); })
      .catch(function (err) { bad(err.message); }).then(function () { b.disabled = false; b.textContent = old; });
  }
});
</script>
</body>
</html>
