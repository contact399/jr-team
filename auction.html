<script>window.addEventListener("error",function(e){var m=document.getElementById("main");if(m)m.textContent="ERR: "+e.message+" @ line "+e.lineno+":"+e.colno});</script>
<script>
(function(){
const DEFAULT_SETTINGS={traveler:"",fx:{EUR:null,CHF:null,GBP:null},fxDate:"",buffer:2,costs:3};
const S={houses:[],lots:[],settings:structuredClone(DEFAULT_SETTINGS),offline:false,canRead:true,auctions:[],pending:0,photoPending:0,pin:null,state:"loading",tab:"appointments",lotHouse:"all",editing:null,msgLang:{},review:null,sample:null,canImages:false,confirmDel:null};
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(/,/g,""));return isFinite(n)?n:null};
const CUR={EUR:"€",CHF:"CHF ",GBP:"£",USD:"$"};
const money=(v,c)=>v==null||!isFinite(v)?"—":(CUR[c]||"")+Math.round(v).toLocaleString("en-US");
const toast=t=>{const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)};

const STEPS={appt:[["found","Contact found"],["sent","Message sent"],["replied","Reply received"],["confirmed","Slot confirmed"],["registered","Registered to bid"],["docs","Condition reports & certs requested"]],
             walk:[["hours","Viewing dates & hours noted"],["order","Visit order planned"],["registered","Registered to bid"],["docs","Condition reports & certs requested"]]};
function stepsFor(h){return h.mode==="walk"?STEPS.walk:STEPS.appt}
function statusOf(h){
  const c=h.checks||{};
  if(h.mode==="walk") return c.hours?["Walk-in · hours set","p-walk"]:["Walk-in","p-walk"];
  if(c.confirmed) return ["Confirmed","p-conf"];
  if(c.replied) return ["Replied","p-sent"];
  if(c.sent) return ["Sent","p-sent"];
  if(h.suggested) return ["Suggested","p-sugg"];
  return ["Not sent","p-todo"];
}

function fxOf(c){return c==="USD"?1:num(S.settings.fx?.[c])}
function bpOf(h){return h?num(h.bp):null}
function increment(v){const t=[[1000,50],[2000,100],[5000,200],[10000,500],[20000,1000],[50000,2000],[100000,5000],[200000,10000],[Infinity,20000]];for(const[l,i]of t)if(v<l)return i}
function hammerFromUSD(maxUSD,cur,bp){
  const fx=fxOf(cur);if(maxUSD==null||!fx||bp==null)return null;
  const costs=num(S.settings.costs)||0,buf=num(S.settings.buffer)||0;
  const net=maxUSD/(1+costs/100), local=net/(fx*(1+buf/100)), ham=local/(1+bp/100);
  const inc=increment(ham);
  return {net,local,ham,inc,round:Math.floor(ham/inc)*inc,fx,costs,buf};
}
function landedFromHammer(h,cur,bp){
  const fx=fxOf(cur);if(h==null||!fx||bp==null)return null;
  const costs=num(S.settings.costs)||0,buf=num(S.settings.buffer)||0;
  return h*(1+bp/100)*fx*(1+buf/100)*(1+costs/100);
}

function call(fn,...args){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](S.pin,...args)})}
function errText(e){const m=String(e?.message||e||"");if(m.includes("PIN:"))return"That PIN is not right.";const x=m.match(/(?:SETUP|READ):\s*([\s\S]*)/);return x?x[1]:"Couldn't save. Check your connection and try again."}
async function write(p,label){try{const v=await p;if(label)toast(label);return v}catch(e){if(String(e?.message||e).includes("PIN:")){lockOut();return}toast(errText(e))}}
function outbox(){try{return JSON.parse(localStorage.getItem("jr_outbox")||"[]")}catch(e){return S._mem||[]}}
function setOutbox(q){S._mem=q;try{localStorage.setItem("jr_outbox",JSON.stringify(q))}catch(e){}S.pending=q.length+(S.photoPending||0)+(S.mediaPending||0)}
function saveCache(){try{localStorage.setItem("jr_cache",JSON.stringify({houses:S.houses,lots:S.lots,auctions:S.auctions,settings:S.settings,t:Date.now()}))}catch(e){}}
function note(t){return navigator.onLine?t:t+" — will sync when you have signal"}
function enqueue(fn,args){const q=outbox();q.push({fn:fn,args:args,t:Date.now()});setOutbox(q);saveCache();flush()}
function isNet(e){const m=String(e?.message||e||"");return !navigator.onLine||/network|http 0|failed to fetch|connection|timed? ?out/i.test(m)}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("jrvb",2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("photos"))d.createObjectStore("photos",{keyPath:"id"});if(!d.objectStoreNames.contains("media"))d.createObjectStore("media",{keyPath:"id"})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbAll(st){st=st||"photos";const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(st).objectStore(st).getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>rej(t.error)})}
async function idbPut(v,st){st=st||"photos";const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(st,"readwrite");t.objectStore(st).put(v);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function idbDel(id,st){st=st||"photos";const db=await idb();return new Promise((res,rej)=>{const t=db.transaction(st,"readwrite");t.objectStore(st).delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function countPhotos(){try{S.photoPending=(await idbAll()).length}catch(e){S.photoPending=0}try{const ms=await idbAll("media");S.mediaQ=ms.map(m=>({id:m.id,lotId:m.lotId,name:m.name,mime:m.mime}));S.mediaPending=ms.length}catch(e){S.mediaQ=[];S.mediaPending=0}S.pending=outbox().length+S.photoPending+S.mediaPending}
function softRender(){const busy=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);if(!busy)render()}
function mediaArr(l){let m=l&&l.media;if(typeof m==="string"){try{m=JSON.parse(m)}catch(e){m=[]}}return Array.isArray(m)?m:[]}
function b64(blob){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]||"");fr.onerror=()=>rej(fr.error);fr.readAsDataURL(blob)})}
async function shrinkBlob(file,max){const bmp=await createImageBitmap(file);const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",0.9))}
const CHUNK=2*1024*1024;
async function uploadMedia(m){
  if(!m.session){const s=await call("startUpload",{houseId:m.houseId,lotNo:m.lotNo,desc:m.desc,name:m.name,mime:m.mime,size:m.blob.size});m.session=s.session;m.offset=0;await idbPut(m,"media")}
  else{const st=await call("uploadStatus",m.session,m.blob.size);if(st.done||st.expired)return st;m.offset=st.offset||0}
  while(m.offset<m.blob.size){const end=Math.min(m.offset+CHUNK,m.blob.size);const data=await b64(m.blob.slice(m.offset,end));
    const r=await call("uploadChunk",m.session,data,m.offset,m.blob.size,m.mime);
    if(r.done||r.expired)return r;
    m.offset=r.offset!=null?r.offset:end;await idbPut(m,"media");
    S.mediaProgress={name:m.name,pct:Math.round(m.offset/m.blob.size*100)};softRender()}
  return await call("uploadStatus",m.session,m.blob.size)}
function pickMedia(lotId){const inp=document.createElement("input");inp.type="file";inp.accept="image"+"/"+"*,video"+"/"+"*";inp.multiple=true;inp.onchange=()=>{if(inp.files&&inp.files.length)queueMedia(lotId,[...inp.files])};inp.click()}
async function queueMedia(lotId,files){const l=S.lots.find(x=>x.id===lotId);if(!l)return;let n=0;
  toast("Saving "+files.length+" file"+(files.length===1?"":"s")+"…");
  for(const f of files){let blob=f,mime=f.type||"application/octet-stream",name=f.name||("media-"+Date.now());
    if(/^image\//.test(mime)){try{blob=await shrinkBlob(f,2400);mime="image/jpeg";name=name.replace(/\.[^.]+$/,"")+".jpg"}catch(e){}}
    if(blob.size>500*1024*1024){toast(name+" is over 500 MB — skipped");continue}
    const rec={id:"m"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),lotId:lotId,houseId:l.houseId,lotNo:l.lotNo,desc:l.desc,name:"Lot "+(l.lotNo||"")+" · "+name,mime:mime,blob:blob,t:Date.now()};
    try{await idbPut(rec,"media");n++}catch(e){toast("Couldn't store "+name+" on this phone")}}
  await countPhotos();if(n)toast(note("Added "+n+" photo/video"+(n===1?"":"s")+" to lot "+(l.lotNo||"")));render();flush()}
function mediaBlock(l){const M=mediaArr(l),P=(S.mediaQ||[]).filter(x=>x.lotId===l.id);if(!M.length&&!P.length)return "";
  return '<div class="media">'+M.map(m=>'<a class="mchip" href="'+esc(m.url)+'" target="_blank" rel="noopener">'+(/^video/.test(m.mime||"")?"Video":"Photo")+" "+esc(String(m.name||"").replace(/^Lot [^·]*· /,"").slice(0,24))+"</a>").join("")+P.map(p=>'<span class="mchip wait">'+(/^video/.test(p.mime||"")?"Video":"Photo")+(navigator.onLine?" · uploading":" · waiting for signal")+"</span>").join("")+"</div>"}
function mediaLine(l){const n=mediaArr(l).length,p=(S.mediaQ||[]).filter(x=>x.lotId===l.id).length;return n||p?'<div class="small">'+(n?n+" photo/video"+(n===1?"":"s"):"")+(p?(n?" · ":"")+p+" waiting to upload":"")+"</div>":""}
function applyResult(fn,r){if(!r||typeof r!=="object")return;
  if(fn==="saveLot"){const i=S.lots.findIndex(x=>x.id===r.id);if(i>=0)S.lots[i]=r;else S.lots.push(r)}
  else if(fn==="saveAuction"){const i=S.auctions.findIndex(x=>x.id===r.id);if(i>=0)S.auctions[i]=r;else S.auctions.push(r)}
  else if(fn==="addHouse"){const i=S.houses.findIndex(x=>x.id===r.id);if(i>=0)S.houses[i]=r;else S.houses.push(r)}
  else if(fn==="saveSettings"&&r.fx){S.settings=deepMerge(structuredClone(DEFAULT_SETTINGS),r)}
  saveCache()}
let flushing=false;
async function drain(){let q=outbox();while(q.length){const it=q[0];
  try{const r=await call(it.fn,...it.args);applyResult(it.fn,r)}
  catch(e){const m=String(e?.message||e);if(m.includes("PIN:")){lockOut();return false}if(isNet(e)){S.offline=true;return false}toast(errText(e))}
  q=outbox();q.shift();setOutbox(q)}return true}
async function flush(){
  if(flushing||!S.pin)return;flushing=true;let ok=true;
  try{
    ok=await drain();
    if(ok){let ph=[];try{ph=await idbAll()}catch(e){}
      for(const p of ph){
        try{const r=await call("readNotes",p.houseId,p.imgs);await idbDel(p.id);
          const hn=(S.houses.find(x=>x.id===p.houseId)||{}).name||"";const n=p.imgs.length;
          toast("Uploaded "+n+" page"+(n===1?"":"s")+" to Drive · "+hn);
          if(r&&r.items&&r.items.length){S.review={status:"ready",houseId:p.houseId,photos:r.photos||[],items:r.items.map(x=>({...x,unsure:Array.isArray(x.unsure)?x.unsure.map(String):[],_keep:true}))}}
          else if(S.review&&S.review.qid===p.id){S.review={status:"saved",msg:"Uploaded "+n+" page"+(n===1?"":"s")+" to Drive under "+hn+". Karan will read them and add the lots."}}}
        catch(e){const m=String(e?.message||e);if(m.includes("PIN:")){ok=false;lockOut();break}if(isNet(e)){ok=false;S.offline=true;break}try{await idbDel(p.id)}catch(_){}S.review={status:"error",msg:errText(e)}}}
    }
    if(ok){let ms=[];try{ms=await idbAll("media")}catch(e){}
      for(const m of ms){
        try{let r=await uploadMedia(m);if(r&&r.expired){m.session=null;m.offset=0;r=await uploadMedia(m)}
          if(r&&r.done){await idbDel(m.id,"media");S.mediaProgress=null;const l=S.lots.find(x=>x.id===m.lotId);
            if(l){l.media=mediaArr(l).concat([{id:r.id,url:r.url,name:m.name,mime:m.mime}]);const q=outbox();q.push({fn:"saveLot",args:[l],t:Date.now()});setOutbox(q);saveCache()}
            toast("Uploaded "+m.name)}}
        catch(e){const msg=String(e?.message||e);if(msg.includes("PIN:")){ok=false;lockOut();break}if(isNet(e)){ok=false;S.offline=true;break}
          m.fail=(m.fail||0)+1;if(m.fail>=5){try{await idbDel(m.id,"media")}catch(_){}toast("Couldn't upload "+m.name+": "+errText(e))}else{try{await idbPut(m,"media")}catch(_){}}}
        await countPhotos();softRender()}
      if(ok)ok=await drain();
    }
    await countPhotos();
    if(ok&&!S.pending){S.offline=false;flushing=false;await load(false);return}
  }finally{flushing=false;S.mediaProgress=null;const busy=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);if(!busy)render()}
}
const store={
  updateHouse(id,patch){const h=S.houses.find(x=>x.id===id);if(!h)return;deepMerge(h,patch);const flat={};for(const k in patch){if(k==="checks")Object.assign(flat,patch.checks);else flat[k]=patch[k]}enqueue("updateHouse",[id,flat])},
  addHouse(fd){const name=String(fd.name||"").trim();if(!name){toast("Enter the auction house name");return null}
    const base=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"house";let id=base,n=2;while(S.houses.some(x=>x.id===id))id=base+"-"+n++;
    const h={id:id,name:name,city:String(fd.city||"").trim()||"Other",date:String(fd.date||"").trim(),mode:fd.mode==="walk"?"walk":"appt",suggested:false,checks:{}};
    S.houses.push(h);enqueue("addHouse",[{...fd,id:id}]);toast(note("House added"));return h},
  saveLot(lot,quiet){if(!lot.id)lot.id="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);lot.updatedAt=Date.now();if(!lot.createdAt)lot.createdAt=Date.now();
    const i=S.lots.findIndex(x=>x.id===lot.id);i>=0?S.lots[i]=lot:S.lots.push(lot);enqueue("saveLot",[lot]);if(!quiet)toast(note("Lot saved"));return lot},
  deleteLot(id){S.lots=S.lots.filter(x=>x.id!==id);enqueue("deleteLot",[id]);toast(note("Lot deleted"));render()},
  saveSettings(patch){deepMerge(S.settings,patch);const flat={};for(const k in patch){if(k==="fx")for(const c in patch.fx)flat["fx"+c]=patch.fx[c];else flat[k]=patch[k]}enqueue("saveSettings",[flat]);render()},
  saveAuction(a){if(!a.id)a.id="a"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const h=S.houses.find(x=>x.id===a.houseId);a.house=h?h.name:(a.house||"");
    const i=S.auctions.findIndex(x=>x.id===a.id);i>=0?S.auctions[i]=a:S.auctions.push(a);enqueue("saveAuction",[a]);toast(note("Auction saved"));return a},
  deleteAuction(id){S.auctions=S.auctions.filter(x=>x.id!==id);enqueue("deleteAuction",[id]);toast(note("Auction deleted"))}
};
function deepMerge(t,p){for(const k in p){if(p[k]&&typeof p[k]==="object"&&!Array.isArray(p[k])){t[k]=t[k]&&typeof t[k]==="object"?t[k]:{};deepMerge(t[k],p[k])}else t[k]=p[k]}return t}

const DATE_IT={"10":"10 novembre","11":"11 novembre"},DATE_FR={"12":"12 novembre"};
function dayOf(h){const m=String(h.date||"").match(/(\d{1,2})/);return m?m[1]:""}
function sig(t){return `${t||"[Name]"}\nJupiter Rain, Inc.\n580 5th Avenue, Floor 21, New York, NY 10036\n+1 212-754-4966 · karan@jupiterrain.com`}
function messages(h){
  const t=S.settings.traveler||"[Name]",d=dayOf(h),who=h.contact?h.contact:"";
  if(h.city==="Milan"){const dIt=DATE_IT[d]||"10–11 novembre";return{
    it_email:`Oggetto: Richiesta appuntamento visione lotti – ${dIt}\n\nGentile ${who||"Dipartimento Gioielli"},\n\nmi chiamo ${t} e sarò a Milano il ${dIt} per conto di Jupiter Rain, Inc. (New York), commercianti di gioielli antichi e pietre preziose.\n\nVorrei fissare un appuntamento privato per visionare i lotti della vostra prossima asta di gioielli, se possibile il ${dIt}. Potreste inviarmi in anticipo i condition report e i certificati gemmologici dei lotti principali?\n\nVorrei inoltre sapere come registrarmi per le offerte (documenti, eventuale deposito) e quali sono le opzioni di spedizione verso gli Stati Uniti.\n\nCordiali saluti,\n${sig(t)}`,
    it_wa:`Buongiorno, sono ${t} di Jupiter Rain (New York). Sarò a Milano il ${dIt} e vorrei un appuntamento per visionare i gioielli della vostra prossima asta. Potreste indicarmi un orario disponibile? Grazie mille.`,
    en:`Dear ${who||"Jewellery Department"},\n\nMy name is ${t} and I will be in Milan on ${d?d+" November":"10–11 November"} on behalf of Jupiter Rain, Inc. (New York), dealers in antique jewelry and gemstones.\n\nI would like to book a private viewing of the lots in your upcoming jewelry sale. Could you send condition reports and lab certificates for the main lots in advance, and let me know how to register to bid and your shipping options to the US?\n\nKind regards,\n${sig(t)}`}}
  if(h.city==="Paris"){const dFr=DATE_FR[d]||"12 novembre";return{
    fr_email:`Objet : Demande de rendez-vous – exposition bijoux – ${dFr}\n\nMadame, Monsieur${who?" ("+who+")":""},\n\nJe m'appelle ${t} et je serai à Paris le ${dFr} pour le compte de Jupiter Rain, Inc. (New York), négociant en bijoux anciens et pierres précieuses.\n\nJe souhaiterais prendre rendez-vous pour examiner les lots de votre prochaine vente de bijoux, si possible le ${dFr}. Pourriez-vous m'envoyer à l'avance les rapports d'état et les certificats gemmologiques des lots principaux ?\n\nJ'aimerais également connaître la procédure d'enregistrement pour enchérir (pièces demandées, éventuelle caution) et les options d'expédition vers les États-Unis.\n\nBien cordialement,\n${sig(t)}`,
    fr_wa:`Bonjour, je suis ${t} de Jupiter Rain (New York). Je serai à Paris le ${dFr} et souhaiterais un rendez-vous pour voir les bijoux de votre prochaine vente. Quel créneau vous conviendrait ? Merci beaucoup.`,
    en:`Dear ${who||"Jewellery Department"},\n\nMy name is ${t} and I will be in Paris on 12 November on behalf of Jupiter Rain, Inc. (New York), dealers in antique jewelry and gemstones.\n\nI would like to book a viewing of the lots in your upcoming jewelry sale. Could you send condition reports and lab certificates for the main lots in advance, and let me know how to register to bid and your shipping options to the US?\n\nKind regards,\n${sig(t)}`}}
  return null;
}
const MSG_LABEL={it_email:"Email (IT)",it_wa:"WhatsApp (IT)",fr_email:"Email (FR)",fr_wa:"WhatsApp (FR)",en:"English"};

function vAppointments(){
  if(S.state==="loading")return `<div class="empty">Loading the checklist…</div>`;
  if(S.state==="slow"&&!S.houses.length)return `<div class="empty">Can't reach the saved checklist yet. Check your connection; it will appear as soon as it loads.</div>`;
  if(!S.houses.length)return `<div class="empty">No auction houses yet. Add them in the Houses tab of the Google Sheet.</div>`;
  const order=["Geneva","Milan","Paris"];const cities=[...new Set(S.houses.map(h=>h.city))].sort((a,b)=>(order.indexOf(a)+1||9)-(order.indexOf(b)+1||9));
  const open=S.houses.filter(h=>h.mode!=="walk"&&!(h.checks||{}).confirmed&&!h.suggested).length;

const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function slotDate(s){const m=String(s||"").match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]{0,9}/);if(!m)return null;const mo=MON[m[2].toLowerCase()];if(mo==null)return null;const now=new Date();let y=now.getFullYear();const d=new Date(y,mo,+m[1]);if(now-d>200*864e5)d.setFullYear(y+1);const t=String(s).match(/(\d{1,2})[:.](\d{2})/);return{date:ymd(d),time:t?t[1].padStart(2,"0")+":"+t[2]:""}}
function calEvents(){
  const E={},add=(d,e)=>{(E[d]=E[d]||[]).push(e)};
  for(const a of S.auctions||[]){
    const n=S.lots.filter(l=>l.auctionId===a.id).length;
    if(a.saleDate)add(String(a.saleDate).slice(0,10),{k:"sale",t:a.saleTime||"",title:a.house+" · "+a.title,sub:[a.location,n?n+" lot"+(n===1?"":"s"):""].filter(Boolean).join(" · "),aid:a.id,short:a.house});
    if(a.viewFrom){const s=new Date(String(a.viewFrom).slice(0,10)+"T12:00:00"),e=a.viewTo?new Date(String(a.viewTo).slice(0,10)+"T12:00:00"):s;for(let d=new Date(s),i=0;d<=e&&i<40;d.setDate(d.getDate()+1),i++)add(ymd(d),{k:"view",t:"",title:"Viewing · "+a.house,sub:[a.title,a.viewHours].filter(Boolean).join(" · "),aid:a.id,short:"View "+a.house})}
  }
  for(const h of S.houses||[]){const p=slotDate(h.slot);if(!p)continue;const ok=h.confirmed===true||String(h.confirmed).toUpperCase()==="TRUE";add(p.date,{k:ok?"appt":"pend",t:p.time,title:h.name+(ok?"":" (not confirmed)"),sub:[h.contact,h.phone&&!/ERROR/.test(h.phone)?h.phone:""].filter(Boolean).join(" · "),hid:h.id,short:(p.time?p.time+" ":"")+h.name.split(" (")[0]})}
  const ord={sale:0,appt:1,pend:1,view:2};for(const d in E)E[d].sort((x,y)=>(x.t||"99").localeCompare(y.t||"99")||ord[x.k]-ord[y.k]);
  return E}
function vCalendar(){
  const E=calEvents(),today=ymd(new Date());
  if(!S.calMonth)S.calMonth=today.slice(0,7);
  const [Y,M]=S.calMonth.split("-").map(Number),first=new Date(Y,M-1,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const inMonth=d=>d.slice(0,7)===S.calMonth;
  if(!S.calDay||!inMonth(S.calDay))S.calDay=inMonth(today)?today:(Object.keys(E).filter(inMonth).sort()[0]||S.calMonth+"-01");
  let g=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="cal-dh">${d}</div>`).join("");
  const cells=Math.ceil(((first.getDay()+6)%7+new Date(Y,M,0).getDate())/7)*7;
  for(let i=0,d=new Date(start);i<cells;i++,d.setDate(d.getDate()+1)){const k=ymd(d),ev=E[k]||[];
    g+=`<button type="button" class="cal-d${inMonth(k)?"":" out"}${k===today?" today":""}" data-act="calday" data-id="${k}" aria-pressed="${k===S.calDay}" aria-label="${esc(fmtD(k))}${ev.length?", "+ev.length+" item"+(ev.length===1?"":"s"):""}"><span class="cal-n">${d.getDate()}</span>${ev.slice(0,3).map(e=>`<span class="cev ${e.k}">${esc(e.short)}</span>`).join("")}${ev.length>3?`<span class="cev more">+${ev.length-3}</span>`:""}</button>`}
  const ev=E[S.calDay]||[];
  const ag=ev.length?ev.map(e=>`<div class="ag"><span class="cev ${e.k}">${e.t?esc(e.t):e.k==="sale"?"Sale":e.k==="view"?"View":"Appt"}</span><div class="ag-b"><b>${esc(e.title)}</b>${e.sub?`<small>${esc(e.sub)}</small>`:""}</div>${e.aid&&e.k!=="view"?`<button type="button" data-act="calsale" data-id="${esc(e.aid)}">Bids →</button>`:e.hid?`<button type="button" class="ghost" data-act="calappt" data-id="${esc(e.hid)}">Details</button>`:""}</div>`).join(""):`<div class="small" style="color:var(--muted)">Nothing on this day.</div>`;
  const next=Object.keys(E).filter(d=>d>=today).sort().slice(0,1)[0];
  return `<section class="panel">
  <div class="cal-head"><h2>${first.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</h2><div class="cal-nav"><button type="button" class="ghost" data-act="calmove" data-id="-1" aria-label="Previous month">‹</button><button type="button" class="ghost" data-act="caltoday">Today</button><button type="button" class="ghost" data-act="calmove" data-id="1" aria-label="Next month">›</button></div></div>
  <div class="cal-key"><span><i class="sale"></i>Sale</span><span><i class="view"></i>Viewing</span><span><i class="appt"></i>Appointment</span><span><i class="pend"></i>Not confirmed</span></div>
  <div class="cal-grid">${g}</div></section>
  <section class="panel"><div class="eyebrow">${esc(fmtD(S.calDay))}</div><div class="agenda">${ag}</div>${next&&!ev.length?`<button type="button" class="link" data-act="calday" data-id="${next}" style="align-self:flex-start">Next: ${esc(fmtD(next))} →</button>`:""}</section>`}

  else if(a==="calday"){S.calDay=id;if(id.slice(0,7)!==S.calMonth)S.calMonth=id.slice(0,7);render()}
  else if(a==="calmove"){const[y,m]=S.calMonth.split("-").map(Number),d=new Date(y,m-1+Number(id),1);S.calMonth=ymd(d).slice(0,7);S.calDay=null;render()}
  else if(a==="caltoday"){S.calMonth=null;S.calDay=null;render()}
  else if(a==="calsale"&&isArchived(S.auctions.find(x=>x.id===id))){S.arcFocus=id;S.aFilter="all";S.tab="archive";render();window.scrollTo(0,0)}
  else if(a==="arcmove"){const au=S.auctions.find(x=>x.id===id);if(au){store.saveAuction({...au,archived:"yes"});S.focus=null;S.arcFocus=id;try{localStorage.removeItem("jr_focus")}catch(e){}render();window.scrollTo(0,0)}}
  else if(a==="arcback"){const au=S.auctions.find(x=>x.id===id);if(au){store.saveAuction({...au,archived:"no"});S.focus=id;S.fFilter="all";try{localStorage.setItem("jr_focus",id)}catch(e){}S.tab="lots";render();window.scrollTo(0,0)}}
  else if(a==="afilter"){S.aFilter=b.dataset.k;render()}
  else if(a==="askclaude"||a==="copyclaude"){const g=saleGroups(S.lots).find(x=>x.key===id);if(g){const p=claudePrompt(g);const cp=()=>{try{navigator.clipboard.writeText(p).catch(()=>{})}catch(e){}};cp();if(a==="askclaude"){const cb="https:"+"/"+"/"+"claude.ai/new",u=cb+"?q="+encodeURIComponent(p);const w=window.open(u.length>7500?cb:u,"_blank");toast(u.length>7500?"Long list: summary copied — paste it into Claude":"Opening Claude…");if(!w)toast("Pop-up blocked — summary copied, paste it into Claude")}else toast("Summary copied — paste it into Claude")}}
  else if(a==="curbid"){const l=S.lots.find(x=>x.id===id);if(l){if(!l.catUrl){toast("This lot has no catalogue link yet — type the bid in");return}b.disabled=true;b.textContent="Checking…";call("getCurrentBid",l.catUrl).then(r=>{if(r&&r.found){l.curBid=r.amount;l.curBidAt=r.at;l.curBidInfo=r.info||"";if(S.draft&&S.draft[id])delete S.draft[id].curBid;store.saveLot(l,true);toast("Current bid: "+money(r.amount,lotFigures(l).cur))}else toast((r&&r.note)||"No current bid found");render()}).catch(e=>{toast(errText(e));render()})}}
  else if(a==="arcopen"){S.arcOpen=S.arcOpen===id?null:id;render()}
  else if(a==="calsale"){S.focus=id;S.lotsAll=false;S.fFilter="all";S.bidOpen=null;try{localStorage.setItem("jr_focus",id)}catch(e){}S.tab="lots";render();window.scrollTo(0,0)}
  else if(a==="calappt"){S.openHouse=id;S.tab="appointments";render();window.scrollTo(0,0)}
  else if(a==="lotsall"){S.lotsAll=true;render();window.scrollTo(0,0)}
  else if(a==="lotsfocus"){S.lotsAll=false;render();window.scrollTo(0,0)}
  else if(a==="approve"){const l=S.lots.find(x=>x.id===id);if(l){const w=approvers(l),n=b.dataset.who,i=w.indexOf(n);if(i>=0)w.splice(i,1);else w.push(n);l.approvedBy=w.join(", ");l.approvedAt=Date.now();store.saveLot(l,true);render();toast(i>=0?n+" removed approval":"Approved by "+n)}}
  else if(a==="aulist"){S.listAuction=id;render();document.getElementById("shortlist")?.scrollIntoView({behavior:"smooth"});document.getElementById("sl-lot")?.focus()}
  else if(a==="slclose"){S.listAuction=null;render()}
  else if(a==="slcopy"){const au=S.auctions.find(x=>x.id===id);const txt=shortlistText(au);try{await navigator.clipboard.writeText(txt);toast("List copied")}catch(_){const box=document.getElementById("sltext");box.hidden=false;const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Selected — copy it from your keyboard")}}
  else if(a==="aulot"){const au=S.auctions.find(x=>x.id===id)||{};S.editing={houseId:au.houseId,auctionId:id,currency:au.houseId&&String(au.houseId).startsWith("gva")?"CHF":"EUR",unit:"ct",myBasis:"ct"};S.tab="lots";if(!S.lotsAll){S.focus=id}render();window.scrollTo(0,0);document.getElementById("lf-lotNo")?.focus()}
  else if(a==="uphouse"){S.upHouse=id;S.lastAdded=null;render()}
  else if(a==="stopread"){S.review?.ctl?.abort()}
  else if(a==="closereview"){S.review=null;render()}
  else if(a==="addreview"){const hid=$("#rv-house").value,keep=S.review.items.filter(x=>x._keep),photo=(S.review.photos||[])[0]||"";S.review=null;render();toast("Saving "+keep.length+" lot"+(keep.length===1?"":"s")+"…");
    for(const it of keep){const l={houseId:hid,lotNo:it.lotNo??"",desc:it.desc??"",weight:it.weight??"",unit:it.unit||"ct",pcs:it.pcs??"",lab:it.lab??"",certNo:it.certNo??"",treatment:it.treatment??"",origin:it.origin??"",currency:it.currency||"EUR",estLow:it.estLow??"",estHigh:it.estHigh??"",myPrice:it.myPrice??"",myBasis:it.myBasis||"ct",maxLocal:it.maxLocal??"",rating:it.rating?String(it.rating):"",remarks:[it.remarks,it.note].filter(Boolean).join(" · "),unsure:it.unsure||[],photo:photo,createdAt:Date.now()};await store.saveLot(l,true)}
    S.lotHouse=hid;S.lastAdded={n:keep.length,name:(S.houses.find(x=>x.id===hid)||{}).name||""};render();toast(keep.length+" lot"+(keep.length===1?"":"s")+" added")}
});
document.addEventListener("submit",e=>{if(e.target.id!=="slform")return;e.preventDefault();const au=S.auctions.find(x=>x.id===S.listAuction);if(!au)return;const fd=Object.fromEntries(new FormData(e.target).entries());if(!String(fd.lotNo||"").trim())return;
  store.saveLot({houseId:au.houseId,auctionId:au.id,lotNo:String(fd.lotNo).trim(),desc:String(fd.desc||"").trim(),rating:fd.rating||"",currency:String(au.houseId).startsWith("gva")?"CHF":"EUR",unit:"ct",myBasis:"ct",seen:false},true);
  toast(note("Lot "+String(fd.lotNo).trim()+" added"));render();document.getElementById("sl-lot")?.focus()});
document.addEventListener("submit",e=>{if(e.target.id!=="auctionform")return;e.preventDefault();const fd=Object.fromEntries(new FormData(e.target).entries());const a={...(S.editAuction||{}),...fd};if(!String(a.title||"").trim()){toast("Enter the sale name");return}store.saveAuction(a);S.editAuction=null;S.auDel=null;render()});
document.addEventListener("submit",async e=>{if(e.target.id!=="houseform")return;e.preventDefault();const fd=Object.fromEntries(new FormData(e.target).entries());const nh=store.addHouse(fd);if(nh){S.openHouse=nh.id;render()}});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="lotform")return;e.preventDefault();
  const fd=new FormData(e.target),l={...S.editing};for(const[k,v]of fd.entries())l[k]=String(v).trim();
  if(S.editing.id&&l.unsure?.length)l.unsure=[];
  if(!l.createdAt)l.createdAt=Date.now();
  S.editing=null;await store.saveLot(l);render();
});

function pickPhotos(){
  const inp=document.createElement("input");inp.type="file";inp.accept="image"+"/"+"*";inp.multiple=true;
  inp.onchange=()=>{if(inp.files?.length)readPhotos([...inp.files])};inp.click();
}
async function shrink(file){
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return {name:file.name,mime:"image/jpeg",data:c.toDataURL("image/jpeg",0.85).split(",")[1]};
  }catch(e){
    if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type))throw new Error("type");
    const d=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
    return {name:file.name,mime:file.type,data:String(d).split(",")[1]};
  }
}
async function readPhotos(files){
  const houseId=S.upHouse||(S.lotHouse!=="all"?S.lotHouse:(S.houses[0]?.id||""));S.lastAdded=null;
  const hn=(S.houses.find(x=>x.id===houseId)||{}).name||"";
  S.review={status:"working",ctl:{abort(){}},msg:"Preparing "+files.length+" page"+(files.length>1?"s":"")+"…",houseId:houseId};render();
  try{
    const imgs=[];for(const f of files.slice(0,8))imgs.push(await shrink(f));
    const n=imgs.length,pl=n===1?"":"s",qid="p"+Date.now().toString(36);
    try{await idbPut({id:qid,houseId:houseId,imgs:imgs,t:Date.now()})}
    catch(e){const out=await call("readNotes",houseId,imgs);S.review={status:"saved",msg:"Saved "+n+" page"+pl+" to Drive under "+hn+"."};render();return}
    await countPhotos();
    S.review={status:"saved",qid:qid,msg:navigator.onLine?"Uploading "+n+" page"+pl+" to Drive under "+hn+"…":"Saved "+n+" page"+pl+" on this phone for "+hn+". They'll upload to Drive automatically when you have signal."};
    render();flush();
  }catch(err){if(String(err?.message||err).includes("PIN:")){lockOut();return}
    S.review={status:"error",msg:String(err?.message)==="type"?"That photo type can't be read. Use JPEG or PNG.":(isNet(err)?"No signal and the phone couldn't store the photos. Try again when you have signal.":errText(err))};render()}
}
document.addEventListener("dragover",e=>{if(e.target.closest?.("#dropzone")&&S.upHouse&&S.canRead)e.preventDefault()});
document.addEventListener("drop",e=>{const z=e.target.closest?.("#dropzone");if(!z||!S.upHouse||!S.canRead)return;e.preventDefault();const f=[...(e.dataTransfer?.files||[])].filter(x=>x.type.startsWith("image/"));if(f.length)readPhotos(f)});
function vPin(){return `<form class="panel" id="pinform" style="max-width:360px;margin:24px auto"><div class="eyebrow">Jupiter Rain · private</div><h2>Enter PIN</h2>
  <label class="field"><span>PIN from Karan</span><input id="pin" class="num" inputmode="numeric" autocomplete="off" required></label>
  ${S.pinErr?`<div class="flag">${esc(S.pinErr)}</div>`:""}<button class="primary" type="submit">Open</button></form>`}
function lockOut(){try{localStorage.removeItem("jr_pin")}catch(e){}S.pin=null;S.pinErr="That PIN is not right.";render()}
document.addEventListener("submit",e=>{if(e.target.id!=="pinform")return;e.preventDefault();S.pin=$("#pin").value.trim();S.pinErr="";S.state="loading";render();load(true)},true);
async function load(first){
  if(!first&&(outbox().length||S.photoPending||S.mediaPending)){flush();return}
  try{const d=await call("getAll");
    if(first){try{localStorage.setItem("jr_pin",S.pin)}catch(e){}}
    if(!first&&(outbox().length||S.photoPending||S.mediaPending)){flush();return}
    S.offline=false;S.canRead=true;S.houses=d.houses;S.lots=d.lots;S.auctions=d.auctions||[];
    S.settings=deepMerge(structuredClone(DEFAULT_SETTINGS),d.settings);S.state="ready";saveCache();
  }catch(e){const m=String(e?.message||e);if(m.includes("PIN:")){lockOut();return}
    if(m.includes("SETUP:")){S.state="ready";$("#main").innerHTML=`<div class="empty">${esc(errText(e))}</div>`;return}
    S.offline=true;if(S.state==="loading")S.state=S.houses.length?"ready":"slow"}
  const busy=document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if(!busy&&S.review?.status!=="working")render();
}
try{S.pin=localStorage.getItem("jr_pin")}catch(e){}
try{const c=JSON.parse(localStorage.getItem("jr_cache")||"null");if(c&&c.houses){S.houses=c.houses;S.lots=c.lots||[];S.auctions=c.auctions||[];S.settings=deepMerge(structuredClone(DEFAULT_SETTINGS),c.settings||{});S.state="ready"}}catch(e){}
S.pending=outbox().length;
route();
countPhotos().then(()=>{render();if(S.pin)load(false)});
window.addEventListener("online",()=>{S.offline=false;render();flush()});
window.addEventListener("offline",()=>{S.offline=true;render()});
setInterval(()=>{if(!S.pin)return;if(S.pending)flush();else if(document.visibilityState==="visible"&&!S.editing&&!S.review&&!S.editAuction)load(false)},45000);
document.addEventListener("visibilitychange",()=>{if(S.pin&&document.visibilityState==="visible"){if(S.pending)flush();else if(!S.editing&&!S.review&&!S.editAuction)load(false)}});
})();
</script>
